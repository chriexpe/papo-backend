  /users/{user_id}/ban:
    put:
      tags: [Users]
      summary: Bane ou desbane um usuário (banimento global)
      description: |
        Permission Check: dono de um servidor ou `manage_server`.
        Ao banir (`ban_state: true`), todas as sessões do usuário são
        revogadas imediatamente e suas conexões WebSocket são encerradas.
        Cookies de sessão remanescentes são rejeitados e expirados na próxima
        requisição autenticada. O usuário banido não pode realizar novo login.
        Desbanir não reativa sessões antigas; é necessário autenticar novamente.
      parameters:
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BanUserRequest'
      responses:
        '200':
          description: Estado de banimento alterado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericResponse'
        '400':
          description: Campo ausente ou inválido
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /users/{user_id}/reset:
    post:
      tags: [Users]
      summary: Prepara troca de senha ou gera link administrativo
      description: |
        Para o próprio usuário, marca `reset_password=true` para permitir a
        troca autenticada em `PUT /users/{user_id}/password`.
        Para outro usuário, exige dono do servidor (role `manage_server`
        não autoriza) e gera um token aleatório de uso único; somente o
        SHA-256 é persistido.
        Um novo link administrativo invalida links anteriores do usuário.
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: Flag de reset preparada (self) ou link administrativo gerado
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/GenericResponse'
                  - $ref: '#/components/schemas/PasswordResetLinkResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /users/me/push-device:
    put:
      tags: [Users]
      summary: Registra ou atualiza o dispositivo de push do usuário autenticado
      description: |
        Upsert do dispositivo de push do usuário autenticado (cookie `Auth`).
        O `user_id` nunca vem do cliente. `platform` deve ser `android` ou
        `ios`; `provider` é opcional (padrão `fcm`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PushDeviceRequest'
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        '400':
          description: Campo ausente ou inválido
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [Users]
      summary: Remove o dispositivo de push do usuário autenticado por token
      description: |
        Remove o dispositivo de push do usuário autenticado (cookie `Auth`)
        identificado pelo `token` no corpo da requisição.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PushDeviceRequest'
      responses:
