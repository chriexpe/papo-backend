          type: string
        color:
          type: string
        permissions:
          $ref: '#/components/schemas/RolePermissions'

    UserRole:
      type: object
      properties:
        user_id:
          type: string
          format: uuid
        role_id:
          type: string
          format: uuid
        assigned_at:
          type: string
