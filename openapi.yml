      description: "Exige `manage_webhooks` e leitura do canal do webhook (`read_channel` na ACL; dono sempre pode; canais sem ACL são abertos). Campos ausentes preservam o valor atual; `avatar` vazio remove o avatar; `display_name` vazio remove o nickname (volta a usar o name)."
