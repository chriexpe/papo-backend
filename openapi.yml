  /users/{user_id}/notifications:
    get:
      tags: [Notifications]
      summary: Lista as notificações do usuário (Limite de 100; paginação por since + last_id; order asc/desc)
      description: "Permission Check: somente o próprio usuário (user_id autenticado)"
      parameters:
        - $ref: '#/components/parameters/UserId'
        - name: since
          in: query
          required: false
          description: Timestamp ISO 8601 para polling de novas notificações
          schema:
            type: string
            format: date-time
        - name: last_id
          in: query
          required: false
          description: Id da última notificação da página anterior; usado com since como cursor exato (created_at, id)
          schema:
            type: string
            format: uuid
        - name: order
          in: query
          required: false
          schema:
            type: string
            enum: [asc, desc]
            default: desc
          description: Direção da paginação e ordenação; has_more se refere a esta direção
      responses:
