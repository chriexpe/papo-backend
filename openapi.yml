          nullable: true
          description: >
            Id da mensagem respondida (sempre do mesmo canal). Null quando a
            mensagem não é uma resposta. Sem FK: pode apontar para uma mensagem
            já excluída (o cliente exibe "mensagem não disponível").
        webhook_id:
          type: string
          format: uuid
          nullable: true
          description: >
            Presente somente em mensagens enviadas por webhook (POST
            /webhooks/{webhook_id}/messages). Null em mensagens humanas.
        external_author:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/ExternalAuthor'
          description: >
            Identidade de exibição de webhook ou app (nunca um usuário do Papo).
            Apps gravam source=app e o snapshot da instalação; somente webhooks
            aceitam autoria temporária no envio. Null em mensagens humanas.
        attachments:
          type: array
          items:
            $ref: '#/components/schemas/Attachment'
          description: >
            O schema (attachments.messages_id) permite múltiplos attachments
            por mensagem.
        embeds:
          type: array
          items:
            $ref: '#/components/schemas/Embed'
          description: >
            Embeds da mensagem: automáticos (source_type='link', extraídos do
            content por OpenGraph/oEmbed, best-effort) e customizados
            (source_type='custom', enviados pela própria mensagem). Vazio
            quando a mensagem não tem embed. Máximo de 10 por mensagem.
        reactions:
          type: array
          items:
            $ref: '#/components/schemas/MessageReactionSummary'
          description: >
            Contagem de tipos de reação da mensagem (sem a lista de usuários;
            use GET /channels/{channel_id}/messages/{message_id}/reactions).
            Null quando a mensagem não tem reações.
        user_reactions:
          type: array
          items:
            $ref: '#/components/schemas/MessageUserReaction'
          description: >
            Reações do usuário autenticado à mensagem (indica com quais emojis
            ele já reagiu). Vazio quando o usuário não reagiu.

