          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ICEServersResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /channels/{channel_id}/messages:
    get:
      tags: [Messages]
      summary: Lista mensagens do canal (Limite de 100; página padrão de 30; paginação por since + last_id; order asc/desc)
      parameters:
        - $ref: '#/components/parameters/ChannelId'
        - name: since
          in: query
          required: false
          schema:
            type: string
            format: date-time
          description: Timestamp ISO 8601 (polling de novas mensagens)
        - name: last_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
          description: ID da última mensagem da página anterior (cursor exato usado com since)
        - name: order
          in: query
          required: false
          schema:
            type: string
            enum: [asc, desc]
            default: desc
          description: Direção da paginação e ordenação; has_more se refere a esta direção
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 30
          description: Tamanho da página em mensagens (1 a 100); fora desse intervalo responde 400
      responses:
        '200':
          description: Mensagens do canal
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageListResponse'
        '400':
          description: Parâmetro de query inválido (since, order ou limit)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /messages:
    post:
      tags: [Messages]
      summary: Envia mensagem
      description: "Permission Check: `send_messages`"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CreateMessageRequest'
      responses:
        '201':
          description: Mensagem criada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '400':
          description: Campo ausente ou inválido
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /messages/{message_id}:
    put:
      tags: [Messages]
      summary: Edita mensagem
      description: "Permission Check: autor da mensagem"
      parameters:
        - $ref: '#/components/parameters/MessageId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMessageRequest'
      responses:
        '200':
          description: Mensagem editada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '400':
          description: Campo ausente ou inválido
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [Messages]
      summary: Remove mensagem
      description: "Permission Check: autor da mensagem ou `delete_messages`"
      parameters:
        - $ref: '#/components/parameters/MessageId'
      responses:
        '204':
          description: Mensagem removida
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
           $ref: '#/components/responses/InternalError'

  /channels/{channel_id}/messages/{message_id}/pin:
    post:
      tags: [Messages]
      summary: Fixa mensagem no canal
      description: "Permission Check: `pin_message` (dono do servidor ou role com a permissão). Idempotente: fixar uma mensagem já pinada retorna 200. Limite de 100 mensagens pinadas por canal."
      parameters:
        - $ref: '#/components/parameters/ChannelId'
        - $ref: '#/components/parameters/MessageId'
      responses:
        '200':
          description: Mensagem já estava pinada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PinnedMessage'
        '201':
          description: Mensagem fixada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PinnedMessage'
        '400':
          description: Parâmetro ausente ou inválido
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
           description: Limite de 100 mensagens pinadas atingido
           content:
             application/problem+json:
               schema:
                 $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [Messages]
      summary: Remove a fixação da mensagem no canal
      description: "Permission Check: `read_channel` do canal e `pin_message` (dono do servidor ou role com a permissão). Não é idempotente: mensagem não pinada retorna 404."
      parameters:
        - $ref: '#/components/parameters/ChannelId'
        - $ref: '#/components/parameters/MessageId'
      responses:
        '204':
          description: Fixação removida
        '400':
          description: Parâmetro ausente ou inválido
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /channels/{channel_id}/pinned:
    get:
      tags: [Messages]
      summary: Lista as mensagens pinadas do canal
      description: "Permission Check: `read_channel` do canal. Retorna as mensagens pinadas com attachments, embeds, thumbnails e reações, na ordem em que foram fixadas (pinned_at crescente)."
      parameters:
        - $ref: '#/components/parameters/ChannelId'
      responses:
        '200':
          description: Mensagens pinadas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PinnedMessageList'
        '400':
          description: Parâmetro ausente ou inválido
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /channels/{channel_id}/messages/{message_id}/reactions:
    post:
      tags: [Messages]
      summary: Adiciona reação do usuário autenticado à mensagem
      description: "Permission Check: `send_messages` do canal. Corpo: exatamente um de `emoji_id` (emoji custom do banco) ou `unicode` (emoji unicode, máx 16 caracteres). Idempotente: reagir de novo com o mesmo emoji retorna 200. Limite de 20 tipos de reação por mensagem."
      parameters:
        - $ref: '#/components/parameters/ChannelId'
        - $ref: '#/components/parameters/MessageId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReactionRequest'
      responses:
        '200':
          description: Usuário já havia reagido com este emoji
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageReaction'
        '201':
          description: Reação adicionada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageReaction'
        '400':
          description: Ambos ou nenhum de emoji_id/unicode informados, ou unicode inválido
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Mensagem não pertence ao canal, canal não existe ou emoji não existe
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Limite de 20 tipos de reação por mensagem atingido
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'
    get:
      tags: [Messages]
      summary: Lista reações da mensagem com os usuários que reagiram (Limite de 100; order asc/desc)
      description: "Permission Check: `read_channel` do canal. Resposta agrupada por tipo de emoji e ordenada por (created_at, id) conforme order. O cursor da próxima página é o par (created_at, id) da última reação da página. `count` é o número de usuários do grupo na página retornada."
      parameters:
        - $ref: '#/components/parameters/ChannelId'
        - $ref: '#/components/parameters/MessageId'
        - name: since
          in: query
          required: false
          schema:
            type: string
            format: date-time
          description: Timestamp ISO 8601 (criado após)
        - name: last_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
          description: ID da última reação da página anterior (cursor exato usado com since)
        - name: order
          in: query
          required: false
          schema:
            type: string
            enum: [asc, desc]
            default: desc
          description: Direção da paginação e ordenação; has_more se refere a esta direção
      responses:
        '200':
          description: Reações da mensagem
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageReactionList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Mensagem não pertence ao canal ou canal não existe
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [Messages]
      summary: Remove a própria reação do usuário autenticado da mensagem
      description: "Permission Check: `read_channel` do canal. Corpo: exatamente um de `emoji_id` ou `unicode`."
      parameters:
        - $ref: '#/components/parameters/ChannelId'
        - $ref: '#/components/parameters/MessageId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReactionRequest'
      responses:
        '204':
          description: Reação removida
        '400':
          description: Ambos ou nenhum de emoji_id/unicode informados, ou unicode inválido
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Mensagem não pertence ao canal, canal não existe, emoji não existe ou usuário não reagiu com este emoji
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'

  /emojis:
    get:
      tags: [Emojis]
      summary: Lista emojis (Limite de 25 por requisição, use cursor com since + last_id para paginar)
      parameters:
        - name: since
          in: query
          required: false
          schema:
            type: string
            format: date-time
          description: Timestamp ISO 8601 (paginação por created_at)
        - name: last_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
          description: ID do último emoji da página anterior (cursor exato usado com since)
        - name: order
          in: query
          required: false
          schema:
            type: string
            enum: [asc, desc]
            default: asc
          description: Direção da paginação e ordenação; has_more se refere a esta direção
      responses:
        '200':
          description: Lista de emojis
          content:
            application/json:
              schema:
                type: object
                properties:
                  emojis:
                    type: array
                    items:
                      $ref: '#/components/schemas/Emoji'
                  has_more:
                    type: boolean
                    description: Indica se há mais itens na direção solicitada por order
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [Emojis]
      summary: Cria emoji (GIF/JPEG/JPG/PNG/WEBP, máx. 256kb, 512px)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEmojiRequest'
      responses:
        '201':
          description: Emoji criado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Emoji'
        '400':
          description: Campo ausente ou inválido
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Nome de emoji já existe ou limite de emojis atingido (500)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'
  /emojis/{emoji_id}:
    delete:
      tags: [Emojis]
      summary: Remove emoji
      description: "Permission Check: Author ou `manage_server`"
      parameters:
        - $ref: '#/components/parameters/EmojiId'
      responses:
        '204':
          description: Emoji removido
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /attachments/{file_id}:
    get:
      tags: [Attachments]
      summary: Download de arquivo
      description: "Permission Check: `read_channel` do canal da mensagem que possui o attachment"
      parameters:
        - name: file_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Arquivo binário (Content-Type = mime type do arquivo)
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '206':
          description: "Parte do arquivo (Range request; Content-Range indica o intervalo atendido)"
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '416':
          description: Intervalo fora do alcance do arquivo (Range não satisfatível)
        '500':
          $ref: '#/components/responses/InternalError'

  /attachments/{file_id}/thumbnail:
    get:
      tags: [Attachments]
      summary: Download da thumbnail do arquivo
      description: >
        Thumbnail gerada no upload (WebP para imagens estáticas, GIF para
        GIFs animados). Permission Check: `read_channel` do canal da mensagem
        que possui o attachment (mesmo check do download original).
      parameters:
        - name: file_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: "Thumbnail binária (Content-Type = image/webp ou image/gif, Content-Disposition: inline)"
          content:
            image/webp:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /media/{sha_hash}:
    get:
      tags: [Media]
      summary: Download de mídia content-addressable (banner, avatar, ícone, ...)
      description: "O sha_hash é unguessable (sha256 do conteúdo); autenticação suficiente, sem check de permissão"
      parameters:
        - name: sha_hash
          in: path
          required: true
          schema:
            type: string
            description: sha256 (hex) da mídia
      responses:
        '200':
          description: "Arquivo binário (Content-Type = mime type da mídia, Content-Disposition: inline)"
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '206':
          description: "Parte do arquivo (Range request; Content-Range indica o intervalo atendido)"
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '416':
          description: Intervalo fora do alcance do arquivo (Range não satisfatível)
        '500':
          $ref: '#/components/responses/InternalError'

  /embeds/{embed_id}:
    get:
      tags: [Embeds]
      summary: Embed (dados + imagem em base64)
      description: >
        Dados do embed com a imagem da thumbnail embutida em base64
        (image_data). Embed de link (source_type='link') é o preview
        automático obtido por OpenGraph/oEmbed e reutilizado pelo cache por
        URL; embed customizado (source_type='custom') pertence à mensagem
        que o enviou.

        Permission Check: `read_channel` do canal da mensagem à qual o embed
        está vinculado (embed sem vínculo acessível → 404). Embed sem imagem
        é acessível (image_data nulo).
      parameters:
        - name: embed_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Embed em JSON com image_data (base64) quando existe
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmbedWithImage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /embeds/{embed_id}/video:
    get:
      tags: [Embeds]
      summary: Relay autenticado do vídeo do embed
      description: >
        Serve o vídeo direto do embed (video.url) por relay do backend, em vez
        de expor a URL original ao cliente (sem hotlink no CDN de origem).
        Suporta `Range` (seek/playback). Somente vídeo HTTPS com MIME de vídeo
        permitido é servido; embed sem vídeo, com tipo não permitido ou com
        redirect que termine fora de HTTPS → 404 (não vaza existência).

        O relay serve apenas arquivos de vídeo: um embed cujo `video.url` é a
        página de iframe allowlistada do provedor (YouTube, sem mime_type) não
        é servido aqui (404) — o cliente renderiza o iframe dessa URL.

        Permission Check: `read_channel` do canal da mensagem à qual o embed
        está vinculado.
      parameters:
        - name: embed_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: "Vídeo binário (Content-Type = mime type do vídeo)"
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '206':
          description: "Parte do vídeo (Range request; Content-Range indica o intervalo atendido)"
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '502':
          description: "Mídia indisponível (falha ao buscar o vídeo na origem)"
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'

  /search:
    post:
      tags: [Search]
      summary: Busca com diversos parâmetros (Limite de 100 por requisição, use cursor com since + last_id para paginar)
      description: |
        Os resultados são limitados a canais legíveis pelo usuário autenticado
        (dono do servidor, canais abertos sem permissões definidas ou canais
        em que uma das suas roles tem read_channel).
      parameters:
        - name: since
          in: query
          required: false
          schema:
            type: string
            format: date-time
          description: Timestamp ISO 8601 (paginação por created_at)
        - name: last_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
          description: ID do último resultado da página anterior (cursor exato usado com since)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SearchRequest'
      responses:
        '200':
          description: Resultados da busca
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResponse'
        '400':
          description: Termo de busca ausente ou inválido
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /admin/audit-logs:
    get:
      tags: [Admin]
      summary: Lista os logs de auditoria (Limite de 100 por requisição, use cursor com since + last_id para paginar)
      description: |
        Retorna os eventos auditáveis na direção definida por order. Requer a permissão `manage_server` (dono do servidor ou role
        com a permissão). Os filtros opcionais podem ser combinados.
      parameters:
        - name: action
          in: query
          required: false
          schema:
            type: string
          description: 'Filtra por ação (ex.: user.ban, message.delete, role.create)'
        - name: actor_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
          description: Filtra por quem executou a ação
        - name: entity_type
          in: query
          required: false
          schema:
            type: string
          description: Filtra por tipo de entidade (user, server, channel, message, attachment, role, user_role, emoji)
        - name: since
          in: query
          required: false
          schema:
            type: string
            format: date-time
          description: Timestamp ISO 8601 (created_at >= since)
        - name: until
          in: query
          required: false
          schema:
            type: string
            format: date-time
          description: Timestamp ISO 8601 (created_at <= until)
        - name: last_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
          description: ID do último log da página anterior (cursor exato usado com since)
        - name: order
          in: query
          required: false
          schema:
            type: string
            enum: [asc, desc]
            default: desc
          description: Direção da paginação e ordenação; has_more se refere a esta direção
      responses:
        '200':
          description: Logs de auditoria
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditLogList'
        '400':
          description: Parâmetro inválido (since/until fora do formato ISO 8601)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

  /webhooks:
    post:
      tags: [Webhooks]
      summary: Cria webhook
      description: "Exige `manage_webhooks` e `read_channel` no canal alvo. O dono sempre pode ler; canais sem ACL são abertos. Máximo de 50 webhooks ativos por canal; revogar libera uma vaga."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateWebhookRequest'
      responses:
        '201':
          description: >
            Webhook criado. O campo `token` é retornado somente aqui (única vez
            em que existe em texto puro; a tabela guarda apenas o hash).
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Webhook'
                  - type: object
                    properties:
                      token:
                        type: string
        '400':
          description: Nome ausente/inválido ou limite de 50 webhooks ativos por canal atingido (invalid-param; detalhe em português)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    get:
      tags: [Webhooks]
      summary: Lista webhooks ativos
      description: >
        Exige `manage_webhooks`. Retorna apenas webhooks de canais que o ator pode
        ler (`read_channel` na ACL; dono sempre pode; canais sem ACL são abertos).
        Segue a paginação de GET /channels/{channel_id}/messages: ordenação
        decrescente por padrão, cursor composto (created_at, id), sem repetir o
        item do cursor. since sem last_id retorna itens mais novos que o timestamp
        (polling), em qualquer ordem;
        last_id sem since é ignorado. A ACL é aplicada antes do limite.
      parameters:
        - name: since
          in: query
          description: Timestamp created_at do último item da página anterior (ISO 8601).
          schema:
            type: string
            format: date-time
        - name: last_id
          in: query
          description: UUID do último item da página anterior; usado junto com since.
          schema:
            type: string
            format: uuid
        - name: order
          in: query
          schema:
            type: string
            enum: [asc, desc]
            default: desc
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 30
      responses:
        '200':
          description: Página de webhooks ativos em canais legíveis; webhooks é [] quando vazia.
          content:
            application/json:
              schema:
                type: object
                required: [webhooks, has_more]
                properties:
                  has_more:
                    type: boolean
                    description: Há mais itens legíveis após esta página na ordem solicitada.
                  webhooks:
                    type: array
                    items:
                      $ref: '#/components/schemas/Webhook'
        '400':
          description: since, last_id, order ou limit inválido (invalid-param).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

