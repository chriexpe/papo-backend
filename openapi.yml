      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        color:
          type: string
          nullable: true
          example: '#FF0000'

    RolePermissions:
      type: object
      properties:
        manage_server:
          type: boolean
        manage_channels:
          type: boolean
        manage_roles:
          type: boolean
        manage_apps:
          type: boolean
        manage_webhooks:
          type: boolean
        ban_members:
          type: boolean
        pin_message:
          type: boolean
        everyone_message:
          type: boolean
        send_attachment:
          type: boolean

    CreateRoleRequest:
