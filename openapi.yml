        image_blob:
          type: string
          format: byte
        created_by:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time

    CreateEmojiRequest:
      type: object
      required: [name, image_blob, format]
      description: Base64 de GIF, JPEG/JPG, PNG ou WEBP (máx. 2MB, 2048px); vazio remove o banner
      properties:
        name:
          type: string
        image_blob:
          type: string
          format: byte
        format:
          type: string
          enum: [GIF, JPEG, JPG, PNG, WEBP]

    SearchResponse:
      type: object
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/SearchResult'
        has_more:
          type: boolean
          description: Indica se há mais itens na direção solicitada por order

    SearchRequest:
      type: object
      description: Pelo menos 1 filtro é obrigatório; os filtros podem ser combinados. Menções usam o formato canônico @mention(<@userId>).
      properties:
        text:
          type: string
          description: Termo de busca
        author:
          type: string
          format: uuid
          description: Filtro por autor da mensagem
        channel_id:
          type: string
          format: uuid
          description: Filtra mensagens de um canal específico
        mention:
          type: string
          format: uuid
          description: Filtra mensagens contendo a menção canônica @mention(<@userId>) deste usuário
        has:
          type: string
          enum: [link]
          description: "link filtra conteúdo que contenha URL http:// ou https://"
        order:
          type: string
          enum: [asc, desc]
          description: Ordem dos resultados por data
        date_start:
          type: string
          format: date
          description: Data inicial do filtro (inclusive)
        date_end:
          type: string
          format: date
          description: Data final do filtro (inclusive)
        contains_attachment:
          type: boolean
          description: Filtra mensagens com attachment

    SearchResult:
      type: object
      properties:
        app_installation_id:
          type: string
          format: uuid
          description: Presente somente em mensagens de app (campo aditivo e omitido nas demais).
        external_author:
          $ref: '#/components/schemas/ExternalAuthor'
        type:
          type: string
          example: message
        id:
          type: string
          format: uuid
        content:
          type: string
        channel_id:
          type: string
          format: uuid
        channel_name:
          type: string
        author_id:
          type: string
          format: uuid
        author_username:
          type: string
        created_at:
          type: string
          format: date-time
        score:
          type: number
          format: double

    AuditLogEntry:
      type: object
      properties:
        id:
          type: string
          format: uuid
        actor_username:
          type: string
          description: Snapshot do username do ator no momento da operação
        action:
          type: string
          description: 'Ação auditável (ex.: user.ban, message.delete, role.create)'
        entity_type:
          type: string
          description: Tipo da entidade afetada (user, server, channel, message, attachment, role, user_role, emoji)
        target_user_id:
          type: string
          format: uuid
          nullable: true
          description: Usuário alvo da ação, quando difere do ator
        metadata:
          type: object
          additionalProperties: true
          description: Dados específicos da ação
        created_at:
          type: string
          format: date-time

    AuditLogList:
      type: object
      properties:
        logs:
          type: array
          items:
