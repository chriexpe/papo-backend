        role_count:
          type: integer

    AppChannel:
      type: object
      description: |
        Superfície que ocupa o canal inteiro; não é aba e não tem conversa.
        Declarada no plugin e criada no enable; disable/remove apaga o canal.
        Renomear, mover e ajustar ACL usa os endpoints normais com manage_channels.
        Exclusão manual e mudança de tipo são recusadas com detalhe em português
        apontando às configurações do app. Upgrade reconcilia por surface_id e
        preserva ID, nome, posição e ACL. Não exige capacidade nem escopo próprio;
        escopos de envio/leitura continuam limitados a text/voice.

        Regras de isolamento obrigatórias (§9.1):
        1. WebView exclusiva e perfil não persistente, sem compartilhar cookies,
           armazenamento ou cache com contextos que acessam a API Papo.
        2. Não injetar sessão, JWT ou cookies. Só o ticket de launch de uso único vai no fragmento da URL.
        3. Não registrar bridge, IPC, callbacks nativos ou scripts injetados.
        4. Remote exige HTTPS, origem aprovada e host diferente de BASE_URL;
           validação de embed mais rejeição a localhost/redes privadas/reservadas,
           inclusive DNS. Backend nunca faz proxy da superfície remota. Bundled
           aceita somente /apps/<instalação ativa>/ui/ com sandbox allow-scripts
           allow-forms, sem allow-same-origin, default-src 'self' mais a origem servida
           configurada e origens aprovadas. Assets estáticos usam CORP cross-origin e
           CORS * sem credenciais; somente essa rota permite leitura pela origem opaca. Essa é a única exceção de URL Papo
           aceita pelo cliente, somente quando recebida num payload autorizado.
           Somente session/rpc da ponte admitem origem opaca, sem credenciais; demais rotas da API recusam null. Origem opaca não tem localStorage/IndexedDB.
        5. Travar navegação à origem, inclusive redirects/scripts. Negar popups,
           downloads, file/esquemas customizados e câmera/microfone/localização/
           clipboard. Links fora da origem seguem o prompt de confirmação existente.
        6. Falha de framing, timeout, indisponibilidade ou falta de isolamento usa
           fallback. Remoto oferece Abrir no navegador com confirmação; bundled
           informa dispositivo não suportado. Nunca enfraquecer o isolamento.

        Canal app ocupa o painel abaixo do cabeçalho, sem timeline/composer/toggle.
        Frames usam size/load/display/poster conforme AppFrameEmbed: inline ativa na
        mensagem; overlay abre popup no chat apenas ao clique. Não há header extra
        de provedor no frame. Há apenas uma superfície ativa entre apps e players
        rich-link; a mais recentemente ativada/visível vence.
        Sair do canal destrói a página; cabeçalho e gestos ficam fora do WebView.
        Instalação desabilitada mantém embeds históricos inertes, sem entry executável.
        channel_create/channel_update/channel_delete são publicados pelo chamador
        após commit, apenas a leitores; exclusão usa a ACL capturada antes de apagar.
      required: [app_installation_id, surface_id, available, avatar_url]
      properties:
        user_actions:
          type: array
          items:
            $ref: '#/components/schemas/AppUserAction'
        app_installation_id: {type: string, format: uuid}
        surface_id: {type: string}
        source:
          type: string
          enum: [bundled, remote]
          description: Origem da superfície do canal app (frames têm schema próprio).
        entry:
          type: string
          description: URL aprovada ou /apps/<id>/ui/...; ausente quando indisponível.
        avatar_url: {type: string}
        available: {type: boolean}
    Channel:
