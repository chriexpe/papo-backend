        `display_name` é o nickname persistente de exibição (null = usa o
        name); o avatar persistente é servido por GET /webhooks/{webhook_id}/avatar.
      properties:
        id:
          type: string
          format: uuid
        channel_id:
          type: string
          format: uuid
        name:
          type: string
        display_name:
          type: string
          nullable: true
        created_by:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
        revoked_at:
          type: string
          format: date-time
          nullable: true

