name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: papo
          POSTGRES_PASSWORD: papo123
          POSTGRES_DB: papo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache: true
          cache-dependency-path: backend/go.sum 

      - name: Configurar Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache: true

      - name: Baixar dependências
        run: go mod download

      - name: Rodar migrations
        run: |
          go install github.com/pressly/goose/v3/cmd/goose@latest
          goose -dir ../migrations postgres "postgres://papo:papo123@localhost:5432/papo_test?sslmode=disable" up

      - name: Instalar TinyGo 0.43.0 e compilar reactors de referência
        run: |
          curl -fL --retry 3 https://github.com/tinygo-org/tinygo/releases/download/v0.43.0/tinygo0.43.0.linux-amd64.tar.gz -o /tmp/tinygo.tar.gz
          echo "ca9fc6d055e3889462dea4450a2e42a92242d88b5c362a7ec39bdb563413d78a  /tmp/tinygo.tar.gz" | sha256sum -c -
          tar -xzf /tmp/tinygo.tar.gz -C /tmp
          TINYGO=/tmp/tinygo/bin/tinygo ../examples/wasm-reference/build.sh

      - name: Build
        run: go build -v ./...

      - name: Testes
        env:
          SERVER_PORT: "8080"
          DATABASE_URL: "postgres://papo:papo123@localhost:5432/papo_test?sslmode=disable"
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          BASE_URL: "https://papo.com/"
          MAX_USERNAME_LENGTH: "16"
          MAX_PASSWORD_LENGTH: "64"
          AUTH_RATE_LIMIT: "5"
          AUTH_RATE_BURST: "10"
          RATE_LIMIT: "20"
          RATE_BURST: "40"
        run: go test -v -coverprofile=coverage.txt -covermode=atomic ./...

      - name: Upload para o Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.txt
          fail_ci_if_error: true 

      - name: Vet
        run: go vet ./...
