              schema:
                $ref: '#/components/schemas/MessageListResponse'
        '400':
          description: Parâmetro inválido (invalid-param)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '429':
          description: 'Token bucket por instalação: 10 requisições/s, burst 20. Retry-After: 1. Além do limite global
            por IP.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - appBearer: []
      parameters:
      - name: since
        in: query
        description: Timestamp created_at do último item da página anterior (ISO 8601).
        schema:
          type: string
          format: date-time
      - name: last_id
        in: query
        description: UUID do último item da página anterior; usado junto com since.
        schema:
          type: string
          format: uuid
      - name: order
        in: query
        schema:
          type: string
          enum:
          - asc
