  /ws:
    get:
      tags: [WebSocket]
      summary: WebSocket (handshake com o mesmo cookie Auth)
      description: |
        Endpoint WebSocket: `ws://localhost:8080/ws`. O JWT do cookie `Auth`
        é validado no handshake. Eventos (conforme `websocket/events.go` e `webrtc/events.go`):

        
        Semântica de conexão dos eventos de voz:
        `voice_join` vincula o Peer WebRTC à conexão WebSocket que enviou o evento.
        Os eventos de sinalização e controle dessa call devem ser enviados pela mesma conexão WebSocket.
        `voice_answer`, `voice_offer` outbound, `voice_ice_candidate` outbound e erros de sinalização são enviados somente para a conexão dona da call, não para todas as abas/dispositivos do mesmo usuário.
        Se a conexão WebSocket dona da call fechar, o Peer é removido mesmo que o mesmo usuário possua outra conexão WebSocket aberta.

        | Event            | Direction | Payload                                                                           |
        | ---------        | --------- | ---------------------------------------------------------------------             |
        | `message`        | outbound  | `{ type: "message", id, channel_id, author_id, webhook_id?, app_installation_id?, external_author?, content, reply_to?, attachments?, created_at }` (reply_to: null quando não é resposta; sem reactions/embeds/user_reactions; webhook_id identifica webhooks, app_installation_id identifica apps; external_author carrega o snapshot de máquinas e author_id fica vazio) |
        | `message_edit`   | outbound  | `{ type: "message_edit", id, channel_id, content, edited_at }`                          |
        | `message_delete` | outbound  | `{ type: "message_delete", id, channel_id }`                                            |
        | `attachment_moderation_update` | outbound  | `{ type: "attachment_moderation_update", channel_id, message_id, attachment_id, status }` (status: sensitive; o blocked exclui a mensagem e chega como `message_delete`) |
        | `message_pin`    | outbound  | `{ type: "message_pin", message_id, is_pinned }` (is_pinned: true quando a mensagem foi pinada, false quando a fixação foi removida) |
        | `react_update`   | outbound  | `{ type: "react_update", message_id, emoji_id, unicode, count }` (emoji_id/unicode: um é null; count = usuários que reagiram com aquele emoji, 0 quando a última foi removida) |
        | `message_embeds_update` | outbound | `{ type: "message_embeds_update", channel_id, message_id, embeds }` (embeds: lista ATUAL de embeds da mensagem, mesma forma do campo `embeds` de `GET /channels/{channel_id}/messages`; metadados apenas, sem `image_data` — a mídia é buscada sob demanda por `GET /embeds/{embed_id}` e `GET /embeds/{embed_id}/video`. Um evento por mensagem, distribuído aos leitores do canal após o crawl em background (criação/edição), após a substituição de embeds na edição (lista vazia quando todos foram removidos) ou quando um embed compartilhado é refetchado por expiração de cache) |
        | `new_notification` | unicast  | `{ type: "new_notification", id, user_id, message_id, message_content }` (id: row de notificação ou UUID efêmero quando a configuração all gera evento sem row; user_id: autor da mensagem; message_content: truncado a 512 caracteres) |
        | `channel_create` | outbound  | `{ type: "channel_create", channel_id, name, channel_type, position, topic?, app? }` (topic: null para canais category) |
        | `channel_update` | outbound  | `{ type: "channel_update", channel_id, name, position, topic?, app? }`                               |
        | `app_invalidate` | outbound | `{ type: "app_invalidate", app_installation_id }`. Revoga imediatamente superfícies vivas e invalida payloads locais dessa instalação em disable, remoção, quarantine e substituição de aprovação. Enviado somente aos leitores atuais de um canal app ou de um canal com embed dessa instalação (inclusive plugins sem canal app), antes da exclusão dos canais. Exige payload REST novo antes de reativar; nunca concede disponibilidade. |
        | `channel_delete` | outbound  | `{ type: "channel_delete", channel_id }`                                               |
        | `typing`         | inbound   | `{ type: "typing", channel_id }`                                                        |
        | `typing`         | outbound  | `{ type: "typing", channel_id, user_id, is_typing }`                                    |
        | `avatar_update`  | outbound  | `{ type: "avatar_update", user_id }`                                                    |
        | `user_join`      | outbound  | `{ type: "user_join", user_id }`                                                        |
        | `role_add`       | outbound  | `{ type: "role_add", user_id, role_id }` (role atribuída ao usuário)                     |
        | `role_remove`    | outbound  | `{ type: "role_remove", user_id, role_id }` (role removida do usuário)                   |
        | `dm_update`      | unicast   | `{ type: "dm_update", dm: DirectConversation }` (estado por usuário; usado para inserir/atualizar a DM na rail) |
        | `presence_update`| outbound  | `{ type: "presence_update", user_id, status, status_message, typing, nickname }` (status: online/offline/away/busy) |
        | `presence_sync`  | unicast   | `{ type: "presence_sync", members: (user_id, status, status_message, user_voice: channel_id[])[] }` (status: online/offline/away/busy; user_voice lista os canais de voz atuais; enviado na conexão; sem nickname) |
        | `presence_activity` | inbound | `{ type: "presence_activity" }` (atividade real do usuário; alimenta o away automático efêmero e não persiste estado) |
        | `heartbeat`      | inbound   | `{ type: "heartbeat" }`                                                                 |
        | `heartbeat_ack`  | outbound  | `{ type: "heartbeat_ack" }`                                                             |
        | `error`          | outbound  | `{ type: "error", message, code? }`                                                     |
        | `voice_join`     | inbound   | `{ type: "voice_join", channel_id }`                                                    |
        | `voice_leave` | outbound | `{ type: "voice_leave", channel_id, user_id }` (saída explícita, conexão WebSocket dona da call caiu, sessão revogada ou sala destruída) |
        | `voice_offer`    | inbound   | `{ type: "voice_offer", channel_id, sdp }` (client-offers-first; renegociações do servidor chegam como `voice_offer` outbound) |
        | `voice_answer`   | inbound   | `{ type: "voice_answer", channel_id, sdp }`                                             |
        | `voice_ice_candidate` | inbound | `{ type: "voice_ice_candidate", channel_id, candidate, sdp_mid?, sdp_mline_index? }`    |
        | `track_subscribe`   | inbound | `{ type: "track_subscribe", channel_id, publisher_id, kind }` (kind: video/screen; vídeo só é forwardado com subscribe explícito) |
        | `track_unsubscribe` | inbound | `{ type: "track_unsubscribe", channel_id, publisher_id, kind }` (kind: video/screen) |
        | `voice_mute` | inbound | `{ type: "voice_mute", channel_id, muted }` (mute autoritativo do servidor: usuário mutado não entra no active-speaker e seu áudio não é forwardado pelo SFU) |
        | `voice_camera` | inbound | `{ type: "voice_camera", channel_id, on }` (deve ser enviado antes do `voice_offer` correspondente; o backend usa esse estado para identificar/validar a publicação de câmera) |
        | `screen_share_start` | inbound | `{ type: "screen_share_start", channel_id }` (deve ser enviado antes do `voice_offer` que adiciona/publica a track de screen) |
        | `screen_share_stop` | inbound | `{ type: "screen_share_stop", channel_id }` (deve ser enviado antes do `voice_offer` que remove/inativa a publicação de screen) |
        | `voice_joined`   | unicast   | `{ type: "voice_joined", channel_id, members: (user_id, muted, camera_on, screen_sharing)[], active_speakers: user_id[] }` (estado inicial do late joiner, o peer novo começa com muted=true camera_on=false screen_sharing=false) |
        | `voice_answer`   | unicast   | `{ type: "voice_answer", channel_id, sdp }` (resposta ao `voice_offer` do cliente)      |
        | `voice_offer`    | unicast   | `{ type: "voice_offer", channel_id, sdp }` (renegociação iniciada pelo servidor)        |
        | `voice_ice_candidate` | unicast | `{ type: "voice_ice_candidate", channel_id, candidate, sdp_mid?, sdp_mline_index? }`    |
        | `voice_state_update` | outbound | `{ type: "voice_state_update", channel_id, user_id, muted, camera_on, screen_sharing }` |
        | `voice_leave`    | outbound  | `{ type: "voice_leave", channel_id, user_id }` (explícita, WS caiu, sessão revogada ou sala destruída) |
        | `active_speaker_update` | outbound | `{ type: "active_speaker_update", channel_id, user_ids: user_id[] }` (top-K active speakers) |
        | `voice_audio_routes` | unicast | `{ type: "voice_audio_routes", channel_id, routes: { track_id, user_id }[] }` (snapshot específico do subscriber; `track_id` é o ID da track SFU `papo-audio-N`; substitui integralmente o snapshot anterior e permite volume/mute local por usuário) |
      responses:
        '101':
          description: WebSocket upgrade
        '401':
          $ref: '#/components/responses/Unauthorized'

  /apps/{installation_id}/ui/{digest}/{path}:
    get:
      tags: [Apps]
      summary: Assets públicos estáticos de uma superfície bundled
      security: []
      description: |
        Rota pública porque a WebView isolada não tem sessão. Serve somente arquivos
        estáticos da pasta ui/ da cópia aprovada do plugin; digest precisa ser o da
        versão habilitada (outro digest responde 404). As URLs chegam prontas nos
        payloads (entry, poster, ícones de ações) e mudam a cada versão; nunca dados por usuário, templates, plugin.toml ou plugin.wasm. Não lê nem
        emite cookies. Instalação desabilitada, revogada, removida ou sem provedor: 404.
        Não lista diretórios; rejeita traversal, caminhos absolutos e symlinks.
        Nada é executado pelo backend. Tipos permitidos: HTML/CSS/JS/JSON, imagens,
        fontes, texto e módulos Wasm dentro de ui/.

        Headers obrigatórios:
        Content-Security-Policy: sandbox allow-scripts allow-forms; default-src 'self' <origem servida>
        (origem explícita extraída de APPS_ORIGIN ou BaseURL, nunca do Host/Forwarded
        da requisição; acrescenta as origens remotas aprovadas; nunca allow-same-origin).
        X-Content-Type-Options: nosniff
        Referrer-Policy: no-referrer
        Cross-Origin-Resource-Policy: cross-origin
        Access-Control-Allow-Origin: *
        Access-Control-Allow-Credentials: ausente (mesmo com o CORS global habilitado)
        ETag: derivado do digest do plugin e do caminho do asset.
        Cache-Control: public, max-age=31536000, immutable (a URL contém o digest da versão).
        Os mesmos headers de isolamento/CORS acompanham respostas 304. UI estática permite
        a leitura por páginas de origem opaca, inclusive fontes, módulos JS e fetch().
        Indisponibilidade responde no-store. O restante da API nunca permite Origin: null,
        mesmo quando CORS_ORIGINS contiver wildcard ou null.
      parameters:
        - {name: installation_id, in: path, required: true, schema: {type: string, format: uuid}}
        - name: digest
          in: path
          required: true
          description: Digest SHA-256 (hex) da versão aprovada do plugin.
          schema: {type: string}
        - name: path
          in: path
          required: true
          description: Caminho do arquivo dentro de ui/, incluindo subdiretórios.
          schema: {type: string}
      responses:
        '200':
          description: Asset estático sob sandbox de origem opaca
          headers:
            Content-Security-Policy: {schema: {type: string}}
            X-Content-Type-Options: {schema: {type: string, enum: [nosniff]}}
            Referrer-Policy: {schema: {type: string, enum: [no-referrer]}}
            Cross-Origin-Resource-Policy: {schema: {type: string, enum: [cross-origin]}}
            Access-Control-Allow-Origin: {schema: {type: string, enum: ['*']}}
            ETag: {schema: {type: string}}
            Cache-Control: {schema: {type: string}}
          content:
            text/html: {schema: {type: string}}
            application/octet-stream: {schema: {type: string, format: binary}}
        '206': {description: Intervalo do asset estático}
        '304': {description: Asset não modificado para o digest/caminho}
        '404': {description: Instalação desabilitada, digest de outra versão ou asset inexistente/não permitido}
