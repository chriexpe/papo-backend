  /webhooks/{webhook_id}/messages:
    post:
      tags: [Webhooks]
      summary: Envia mensagem via webhook
      security: []
      description: |
        Autenticação: header `Authorization: Bearer <token>` do webhook (nunca
        cookie de sessão). Mesma validação/attachments/embeds de POST /messages.
        `external_message_id` é a chave de idempotência opcional: retry com a
        mesma chave devolve 200 com a mensagem existente (sem duplicar).
        `external_author` (JSON) sobrescreve a identidade persistente do
        webhook somente nesta mensagem.
      parameters:
        - $ref: '#/components/parameters/WebhookId'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                content:
                  type: string
                external_message_id:
                  type: string
                  maxLength: 200
                external_author:
                  type: string
                  description: JSON de ExternalAuthor (autoria temporária)
                reply_to:
                  type: string
                  format: uuid
                embeds:
                  type: string
                  description: JSON array de embeds customizados
                attachments:
                  type: array
                  items:
                    type: string
                    format: binary
      responses:
        '201':
          description: Mensagem criada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '200':
          description: Retry idempotente (mensagem existente, mesmo shape da criação)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '400':
          description: Corpo não-multipart, external_author/embeds inválidos ou limite excedido
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
