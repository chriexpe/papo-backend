        capabilities:
          $ref: '#/components/schemas/AppCapabilities'
    AppEditRequest:
      $ref: '#/components/schemas/UpdateMessageRequest'

    AppEventSnapshot:
      type: object
      description: |
        Snapshot de message.created. A autoria é human, webhook ou app.
        external_author é a identidade externa capturada; reply_to pode apontar
        para uma mensagem já excluída. Nenhum embed ou preview é incluído.
      required: [channel_id, message_id, sender_kind, sender_id, content, external_author, reply_to, created_at, attachments]
      properties:
        channel_id:
          type: string
          format: uuid
        message_id:
          type: string
          format: uuid
        sender_kind:
          type: string
          enum: [human, webhook, app]
        sender_id:
          type: string
          format: uuid
          nullable: true
        external_author:
          allOf:
            - $ref: '#/components/schemas/ExternalAuthor'
          nullable: true
        content:
          type: string
          nullable: true
        reply_to:
          type: string
          format: uuid
          nullable: true
        created_at:
          type: string
          format: date-time
        attachments:
          type: array
          items:
            $ref: '#/components/schemas/AppEventAttachment'
    AppEventAttachment:
      type: object
      description: Metadados imutáveis; o ID usa o caminho normal de mídia e pode deixar de existir.
      additionalProperties: false
      required: [id, mime_type, original_file_name, size_bytes, created_at]
      properties:
        id:
          type: string
          format: uuid
        mime_type:
          type: string
        original_file_name:
          type: string
        size_bytes:
          type: integer
          format: int64
        created_at:
          type: string
          format: date-time
    AppEventTombstone:
      type: object
      description: |
        IDs apenas. channel.deleted contém somente channel_id; message.deleted
        também contém message_id. Um snapshot created/updated redigido contém
        ambos e redacted:true, preservando o tipo e event_id originais.
      additionalProperties: false
      required: [channel_id]
      properties:
        channel_id:
          type: string
          format: uuid
        message_id:
          type: string
          format: uuid
        redacted:
          type: boolean
          enum: [true]
    AppEventMessageUpdate:
      type: object
      required: [channel_id, message_id, content, edited_at]
      properties:
        channel_id:
          type: string
          format: uuid
        message_id:
          type: string
          format: uuid
        content:
          type: string
          nullable: true
        edited_at:
          type: string
          format: date-time
    AppEventReaction:
      type: object
      description: Exatamente um de emoji_id e unicode é não nulo. Sem conteúdo de mensagem.
      required: [channel_id, message_id, user_id, emoji_id, unicode]
      properties:
        channel_id:
          type: string
          format: uuid
        message_id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        emoji_id:
          type: string
          format: uuid
          nullable: true
        unicode:
          type: string
          nullable: true
    AppEventDelivery:
      type: object
      description: |
        Envelope durável do dispatch. delivery_seq é local à instalação e pode
        conter lacunas por autorização/retenção. event_id identifica o fato entre
        tentativas; nenhum UUID serve como cursor. O frame WSS acrescenta op e epoch.
      required: [event_id, type, channel_id, payload, created_at, delivery_seq]
      properties:
        event_id:
          type: string
          format: uuid
        type:
          type: string
          enum: [message.created, message.updated, message.deleted, reaction.added, reaction.removed, channel.deleted]
        channel_id:
          type: string
          format: uuid
        message_id:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
        delivery_seq:
          type: integer
          format: int64
          minimum: 1
        payload:
          anyOf:
            - $ref: '#/components/schemas/AppEventSnapshot'
            - $ref: '#/components/schemas/AppEventMessageUpdate'
            - $ref: '#/components/schemas/AppEventReaction'
            - $ref: '#/components/schemas/AppEventTombstone'

    AppGatewayClientFrame:
      type: object
      description: hello inicia a conexão; ack/heartbeat exigem a epoch de ready.
      required: [op]
      properties:
        op:
          type: string
          enum: [hello, ack, heartbeat]
        resume_after:
          type: integer
          format: int64
          minimum: 0
          description: Apenas em hello; ausente usa o último ack durável.
        epoch:
          type: integer
          format: int64
          minimum: 1
        delivery_seq:
          type: integer
          format: int64
          minimum: 0
          description: Obrigatório em ack; maior prefixo já processado nesta época.
    AppGatewayServerFrame:
      type: object
      description: |
        Discriminador op. hello inclui version e heartbeat_interval_ms; ready e
        resync_required incluem epoch/cursor/replay_floor/last_seq; heartbeat_ack
        inclui epoch. dispatch acrescenta os campos de AppEventDelivery no mesmo
        objeto (event_id, type, channel_id, message_id, payload, created_at, delivery_seq).
      required: [op]
      properties:
        op:
          type: string
          enum: [hello, ready, dispatch, heartbeat_ack, resync_required]
        version:
          type: integer
          enum: [1]
        heartbeat_interval_ms:
          type: integer
          example: 30000
        epoch:
          type: integer
          format: int64
        cursor:
          type: integer
          format: int64
        replay_floor:
          type: integer
          format: int64
        last_seq:
          type: integer
          format: int64
        event_id:
          type: string
          format: uuid
        delivery_seq:
          type: integer
          format: int64
        type:
          type: string
          enum: [message.created, message.updated, message.deleted, reaction.added, reaction.removed, channel.deleted]
        channel_id:
          type: string
          format: uuid
        message_id:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
        payload:
          anyOf:
            - $ref: '#/components/schemas/AppEventSnapshot'
            - $ref: '#/components/schemas/AppEventMessageUpdate'
            - $ref: '#/components/schemas/AppEventReaction'
            - $ref: '#/components/schemas/AppEventTombstone'

    PluginOptions:
      type: object
      additionalProperties: false
      properties:
        storage_quota:
          $ref: '#/components/schemas/AppStorageQuotaOverride'
        settings: {type: object, additionalProperties: true}
        permissions:
          type: array
          items: {type: string, enum: [send_messages, read_messages, post_app_embeds, private_storage]}
        scopes:
          type: array
          items: {type: string, format: uuid}
        max_memory_mb: {type: integer, minimum: 1, maximum: 256}
        consent: {type: string, minLength: 64, maxLength: 64}
        expires_at: {type: integer, format: int64}
    PluginPatch:
      type: object
      additionalProperties: false
      properties:
        storage_quota:
          $ref: '#/components/schemas/AppStorageQuotaOverride'
        settings: {type: object, additionalProperties: true}
        max_memory_mb: {type: integer, minimum: 1, maximum: 256}
        consent: {type: string, minLength: 64, maxLength: 64}
        expires_at: {type: integer, format: int64}
    PluginPreview:
      type: object
      required: [id, digest, version, name, settings, requested_permissions, permissions, blocked_permissions, scopes, explicit_scopes, origins, surfaces, max_memory_mb, revision, state, expires_at, consent]
      properties:
        storage_quota:
          $ref: '#/components/schemas/AppStorageQuota'
        storage_quota_overrides:
          $ref: '#/components/schemas/AppStorageQuotaOverride'
        id: {type: string}
        digest: {type: string, pattern: '^[0-9a-f]{64}$'}
        version: {type: string}
        name: {type: string}
        settings: {type: object}
        requested_permissions: {type: array, items: {type: string}}
        permissions: {type: array, items: {type: string}}
        blocked_permissions: {type: array, items: {type: string}}
        scopes: {type: array, items: {type: string, format: uuid}}
        explicit_scopes: {type: array, items: {type: string, format: uuid}}
        origins: {type: array, items: {type: string}}
        surfaces:
          type: array
          items:
            type: object
            required: [id, kind, source, entry]
            properties:
              id: {type: string}
              kind: {type: string, enum: [channel, embed]}
              source: {type: string, enum: [bundled, remote]}
              entry: {type: string}
              default_name: {type: string}
              frame_width: {type: integer}
              frame_height: {type: integer}
        max_memory_mb: {type: integer}
        revision: {type: integer, format: int64}
        state: {type: string, enum: [discovered, enabled, disabled, quarantined, removed]}
        expires_at: {type: integer, format: int64}
        consent: {type: string}
    PluginCatalog:
      type: object
      properties:
        plugins:
          type: array
          items:
            type: object
            required: [id]
            properties:
              id: {type: string}
              digest: {type: string}
              error: {type: string}
              manifest:
                type: object
                description: Metadados plugin.toml v1 validados sem executar código. Schema completo em docs/wasm-plugins.md.
              installation:
                $ref: '#/components/schemas/AppInstallation'
    PluginResult:
      type: object
      required: [ok]
      properties:
        ok: {type: boolean}
        result: {}
        error:
          type: object
          properties:
            code: {type: string}

    AppButton:
      type: object
      additionalProperties: false
      required:
      - id
      - label
      - style
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 64
        label:
          type: string
          minLength: 1
          maxLength: 80
        style:
          type: string
          enum:
          - primary
          - secondary
          - danger
        disabled:
          type: boolean
          default: false
        opens:
          type: string
          description: ID de superfície embed própria. Abre diretamente, sem on_interaction.
    AppComponents:
      type: array
      maxItems: 2
      items:
        type: array
        minItems: 1
        maxItems: 5
        items:
          $ref: '#/components/schemas/AppButton'
      description: Até dez botões, IDs únicos por mensagem. Desabilitados se o plugin
        estiver indisponível. message e message_edit carregam components de forma aditiva;
        [] em edição remove os botões.
    AppUserAction:
      type: object
      additionalProperties: false
      required:
      - id
      - label
      properties:
        id:
          type: string
        label:
          type: string
        icon:
          type: string
          description: URL pública de imagem validada em ui/.
    AppInteraction:
      type: object
      additionalProperties: false
      required:
      - app_installation_id
      - channel_id
      - kind
      properties:
        app_installation_id:
          type: string
          format: uuid
        channel_id:
          type: string
          format: uuid
        kind:
          type: string
          enum:
          - button
          - user_action
        message_id:
          type: string
          format: uuid
        component_id:
          type: string
        action_id:
          type: string
        target_user_id:
          type: string
          format: uuid
    AppLaunch:
      type: object
      additionalProperties: false
      required:
      - surface_id
      - channel_id
      properties:
        surface_id:
          type: string
        channel_id:
          type: string
          format: uuid
        message_id:
          type: string
          format: uuid
        invite_id:
          type: string
          format: uuid
    AppTicket:
      type: object
      additionalProperties: false
      required:
      - ticket
      properties:
        ticket:
          type: string
          writeOnly: true
    AppRPC:
      type: object
      additionalProperties: false
      required:
      - method
      - params
      properties:
        method:
          type: string
          minLength: 1
          maxLength: 100
        params:
          description: JSON de até 32 KiB; não concede identidade.
    AppInvite:
      type: object
      additionalProperties: false
      required: []
      properties:
        id:
          type: string
          format: uuid
        app_installation_id:
          type: string
          format: uuid
        inviter_id:
          type: string
          format: uuid
        channel_id:
          type: string
          format: uuid
        surface_id:
          type: string
        text:
          type: string
          maxLength: 500
        data: {}
        status:
          type: string
          enum:
          - pending
          - accepted
          - declined
        expires_at:
          type: string
          format: date-time
    AppUserSettings:
      type: object
      additionalProperties: false
      required:
      - invites_muted
      properties:
        invites_muted:
          type: boolean
    AppLaunchResult:
      type: object
      additionalProperties: false
      required: [ticket, expires_at, surface]
      properties:
        ticket:
          type: string
        expires_at:
          type: string
          format: date-time
        surface:
          $ref: '#/components/schemas/AppChannel'
        display:
          type: string
          enum: [inline, overlay, '']
        load:
          type: string
        size:
          type: object
          properties:
            width:
              type: integer
            height:
              type: integer
        poster:
          type: string
    AppUISession:
      type: object
      additionalProperties: false
      required: []
      properties:
        token:
          type: string
        session_id:
          type: string
          format: uuid
        expires_at:
          type: string
          format: date-time
        absolute_expires_at:
          type: string
          format: date-time
    AppInteractionResult:
      type: object
      additionalProperties: false
      required: [interaction_id, result]
      properties:
        interaction_id:
          type: string
          format: uuid
        result:
          description: >
            Valor de result no envelope {"ok":true,"result":...} do on_interaction,
            sem alteração; null quando o plugin não devolve result.
          nullable: true

    AppUserProfile:
      type: object
      additionalProperties: false
      required:
      - id
      - username
      - display_name
      - avatar_url
      description: Projeção pública mínima. Sem e-mail, IP, roles, status, hashes, banner
        ou outros dados privados. display_name usa nickname, com fallback para username.
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        display_name:
          type: string
        avatar_url:
          type: string
          nullable: true
          pattern: ^/users/[0-9a-f-]{36}/avatar$
          description: Caminho relativo ao servidor; endpoint público com CORS * sem credenciais
            e CORP cross-origin. null quando o usuário não tem avatar.
    AppStorageQuotaOverride:
      type: object
      additionalProperties: false
      properties:
        max_keys:
          type: integer
          minimum: 0
          maximum: 100000
        max_total_bytes:
          type: integer
          minimum: 0
          maximum: 1073741824
        max_value_bytes:
          type: integer
          minimum: 0
          maximum: 65536
      description: 'Override administrativo parcial: ausente conserva o override atual;
        zero volta ao default global. Não é metadado controlado pelo plugin. Não remove
        dados existentes; escritas respeitam a quota atual sob lock SQL.'
    AppStorageQuota:
      type: object
      required:
      - max_keys
      - max_total_bytes
      - max_value_bytes
      properties:
        max_keys:
          type: integer
          default: 256
        max_total_bytes:
          type: integer
          default: 1048576
        max_value_bytes:
          type: integer
          default: 16384
      description: 'Limites efetivos: defaults PLUGINS_STORAGE_MAX_KEYS/MAX_TOTAL_BYTES/MAX_VALUE_BYTES
        mais overrides positivos. Bytes contam chave UTF-8 e JSONB normalizado; valor
        não inclui chave. O transporte ABI mantém seu teto independente.'
    AppUsersResolve:
      type: object
      additionalProperties: false
      required:
      - method
      - ids
      properties:
        method:
          type: string
          enum:
          - users.resolve
        ids:
          type: array
          maxItems: 50
          items:
            type: string
            format: uuid
      description: Host call via papo_host_v1.call, não uma rota REST. Instalação plugin
        habilitada. Omite negados, banidos e inexistentes sem distingui-los; inclui apenas
        leitores de pelo menos um canal app próprio ou escopo atual. IDs duplicados são
        deduplicados, preservando ordem. Limite padrão 120 chamadas/min por instalação,
        PLUGINS_USERS_RESOLVE_PER_PLUGIN.
    AppUsersResolveResult:
      type: array
      maxItems: 50
      items:
        $ref: '#/components/schemas/AppUserProfile'
    AppHumanCallbackProfiles:
      type: object
      required:
      - user
      properties:
        user:
          $ref: '#/components/schemas/AppUserProfile'
        target_user:
          $ref: '#/components/schemas/AppUserProfile'
      description: 'Campos aditivos de input em on_interaction/on_ui_call: user vem do
        usuário autenticado, nunca de params ou request. target_user só existe em user_action.
        user_id/target_user_id legados permanecem. Não são aceitos como identidade na
        API de interações.'
