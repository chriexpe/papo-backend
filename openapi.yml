openapi: 3.0.3
info:
  title: Papo API
  description: |
    API do Papo — chat self-hosted (Go + Echo + PostgreSQL + WebSockets).

    Convenções:
    - Autenticação via cookie HttpOnly `Auth` (JWT).
    - Erros seguem RFC 7807 (`application/problem+json`) e toda resposta
      inclui o header `X-Request-ID`.
    Eventos duráveis de apps:
    - As mutações e seus snapshots são confirmados na mesma transação.
    - São produzidos message.created, message.updated, message.deleted,
      reaction.added, reaction.removed e channel.deleted somente se houver
      instalação ativa com read_messages e escopo no canal text/voice.
    - message.created não é produzido em conflitos idempotentes.
    - O conteúdo é um snapshot do instante da escrita; não inclui embeds,
      previews nem bytes de anexos. REST continua sendo a fonte do estado atual.
    - Exclusões redigem snapshots created/updated sem confirmação durável,
      inclusive aqueles já atribuídos ao backlog: apenas IDs e redacted:true.
      Eventos já confirmados são história e não são retraídos.
    - Conteúdo exige instalação ativa, read_messages e escopo no momento da
      leitura para entrega. Tombstones content-free capturam destinatários na
      escrita, antes da cascata de escopos; para eles basta a instalação ativa.
    - O dispatcher usa claims transacionais SKIP LOCKED e sequências locais
      por instalação. A ordem é a atribuição, sem promessa de ordem por UUID,
      início da transação ou timestamp. Consumidores deduplicam por event_id.
    - Snapshots expiram por idade (APP_EVENT_RETENTION_DAYS, padrão 7 dias)
      e backlog por instalação (APP_EVENT_MAX_DELIVERIES, padrão 10000).
      A poda mantém replay_floor para detectar lacunas de retenção; novas
      instalações não recebem fatos anteriores à sua criação.
    - GET /app/gateway promove WSS autenticado com Bearer explícito. O protocolo
      é hello -> ready -> dispatch -> ack, com heartbeat e uma única época ativa
      por instalação. Reentrega é at-least-once; consumidores deduplicam event_id.
      Replay abaixo de replay_floor recebe resync_required e exige reconciliação REST.
  version: 1.0.0
servers:
  - url: http://localhost:8080
    description: Backend local
tags:
  - name: Health
  - name: Auth
  - name: Users
  - name: DirectMessages
  - name: Servers
  - name: Channels
  - name: Messages
  - name: Notifications
  - name: Roles
  - name: UserRoles
  - name: Emojis
  - name: Attachments
  - name: Media
  - name: Embeds
  - name: Search
  - name: Admin
  - name: Voice
  - name: WebSocket
  - name: Webhooks
  - name: Apps

security:
  - cookieAuth: []

paths:
  /health:
    get:
      tags: [Health]
      summary: Health check
      security: []
      responses:
        '200':
          description: Servidor no ar
          content:
            text/plain:
              example: OK

  /auth/register:
    post:
      tags: [Auth]
      summary: Cria novo usuário
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Usuário criado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterResponse'
        '400':
          description: Campo ausente ou inválido
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Servidor não público sem autorização temporária (execute /auth/login_server antes)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          $ref: '#/components/responses/Banned'
        '409':
          description: Username já existe
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'

  /auth/login:
    post:
      tags: [Auth]
      summary: Faz login e define o cookie Auth (HttpOnly)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: "Login bem-sucedido (Set-Cookie: Auth=jwt)"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          description: Campo ausente ou inválido
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Credenciais inválidas ou servidor não público sem autorização temporária (execute /auth/login_server antes)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          $ref: '#/components/responses/Banned'
        '500':
          $ref: '#/components/responses/InternalError'

  /auth/login_server:
    post:
      tags: [Auth]
      summary: Valida a senha do servidor e define o cookie Auth com token temporário (30min)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginServerRequest'
      responses:
        '204':
          description: "Senha válida (Set-Cookie: Auth=temp_token; Max-Age=1800). O token não é retornado no corpo; a autorização é entregue exclusivamente pelo cookie Auth (HttpOnly)"
        '400':
          description: Campo ausente ou inválido
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Senha do servidor incorreta
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          $ref: '#/components/responses/Banned'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /auth/password_reset:
    post:
      tags: [Auth]
      summary: Consome um link administrativo de troca de senha
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetConsumeRequest'
      responses:
        '200':
          description: Senha alterada; o token fica invalidado e sessões existentes são revogadas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericResponse'
        '400':
          description: Token/senha ausente ou senha fora da política
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
        '410':
          description: Link inválido, expirado ou já utilizado
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'

  /auth/whoami:
    get:
      tags: [Auth]
      summary: Retorna o usuário autenticado com settings
      responses:
        '200':
          description: Usuário autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WhoamiResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /auth/logout:
    post:
      tags: [Auth]
      summary: Faz logout (revoga a conexão de sessão no banco e remove o cookie Auth)
      security: []
      responses:
        '204':
          description: Logout bem-sucedido (Set-Cookie expira o Auth)

  /auth/refresh:
    post:
      tags: [Auth]
      summary: Rotaciona o token de sessão (novo JWT + Set-Cookie) e retorna a conexão atual
      description: Uma JWT expirada (24h), ainda pode ser refreshed em até 30 dias, gerando uma sessão contínua indefinidamente.
      responses:
        '200':
          description: "Sessão rotacionada (Set-Cookie: Auth=novo_jwt)"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefreshResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /auth/connected_devices:
    get:
      tags: [Auth]
      summary: Lista as conexões de sessão ativas do usuário
      responses:
        '200':
          description: Conexões ativas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectedDevicesResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /auth/drop_connection:
    post:
      tags: [Auth]
      summary: Revoga uma conexão de sessão (id específico ou ALL para todas)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DropConnectionRequest'
      responses:
        '200':
          description: Conexão(ões) revogada(s)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DropConnectionResponse'
        '400':
          description: connection_id ausente ou inválido
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /users/{user_id}/profile:
    get:
      tags: [Users]
      summary: Perfil do usuário (com avatar); qualquer usuário autenticado pode consultar
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: Perfil do usuário
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /users/profile_batch:
    post:
      tags: [Users]
      summary: Perfis em lote (mesma forma do profile; máx. 50 ids; ids inexistentes são pulados)
      description: |
        Retorna os perfis dos usuários solicitados, na ordem da requisição,
        pulando ids que não existem. Ids duplicados são considerados uma única
        vez. Máximo de 50 ids por requisição.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileBatchRequest'
      responses:
        '200':
          description: Perfis dos usuários encontrados (na ordem da requisição)
          content:
            application/json:
              schema:
                type: object
                properties:
                  profiles:
                    type: array
                    items:
                      $ref: '#/components/schemas/UserProfile'
        '400':
          description: Campo ausente ou inválido (ids ausente/vazio, id vazio ou mais de 50 ids)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /users/user_summary_batch:
    post:
      tags: [Users]
      summary: UserSummary em lote (máx. 1000 ids)
      description: |
        Retorna um array de UserSummary na ordem dos ids informados.
        Ids inexistentes são pulados e ids duplicados aparecem apenas na
        primeira ocorrência.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserSummaryBatchRequest'
      responses:
        '200':
          description: Resumos dos usuários encontrados
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserSummary'
        '400':
          description: ids vazio, com item vazio ou acima de 1000 itens
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /dms:
    get:
      tags: [DirectMessages]
      summary: Lista DMs visíveis do usuário autenticado
      description: DMs fechadas na rail e DMs com bloqueio ativo não são retornadas.
      responses:
        '200':
          description: Lista de mensagens diretas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DirectConversationList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [DirectMessages]
      summary: Abre ou cria uma DM com outro usuário
      description: Idempotente por par de usuários. Reabre a DM para o solicitante quando ela já existe.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OpenDirectMessageRequest'
      responses:
        '200':
          description: DM existente reaberta
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DirectConversation'
        '201':
          description: DM criada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DirectConversation'
        '400':
          description: user_id inválido ou igual ao usuário autenticado
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Existe bloqueio entre os usuários (type dm-blocked)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /dms/{dm_id}:
    parameters:
      - name: dm_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [DirectMessages]
      summary: Obtém uma DM do usuário autenticado
      responses:
        '200':
          description: Mensagem direta
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DirectConversation'
        '403':
          description: Existe bloqueio entre os participantes (type dm-blocked)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [DirectMessages]
      summary: Fecha uma DM na rail do usuário
      description: Não apaga histórico. Uma nova mensagem válida faz a conversa reaparecer.
      responses:
        '204':
          description: DM fechada
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /users:
    get:
      tags: [Users]
      summary: Lista usuários (Limite de 100 por requisição, use cursor com since + last_id para paginar)
      parameters:
        - name: since
          in: query
          required: false
          schema:
            type: string
            format: date-time
          description: Timestamp ISO 8601 (polling de novos usuários)
        - name: last_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
          description: ID do último usuário da página anterior (cursor exato usado com since)
        - name: order
          in: query
          required: false
          schema:
            type: string
            enum: [asc, desc]
            default: asc
          description: Direção da paginação e ordenação; has_more se refere a esta direção
      responses:
        '200':
          description: Lista de usuários
          content:
            application/json:
              schema:
                type: object
                properties:
                  users:
                    type: array
                    items:
                      $ref: '#/components/schemas/UserSummary'
                  has_more:
                    type: boolean
                    description: Indica se há mais itens na direção solicitada por order
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /users/blocks:
    get:
      tags: [Users]
      summary: Lista usuários bloqueados pelo usuário autenticado
      responses:
        '200':
          description: Usuários bloqueados
          content:
            application/json:
              schema:
                type: object
                required: [users]
                properties:
                  users:
                    type: array
                    items:
                      $ref: '#/components/schemas/UserSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /users/{user_id}/block:
    parameters:
      - $ref: '#/components/parameters/UserId'
    post:
      tags: [Users]
      summary: Bloqueia um usuário para mensagens diretas
      description: Idempotente. O bloqueio vale nas duas direções para DM e não afeta mensagens em canais públicos.
      responses:
        '204':
          description: Usuário bloqueado
        '400':
          description: Não é permitido bloquear a si mesmo
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [Users]
      summary: Desbloqueia um usuário
      description: Idempotente. Desbloquear não reabre automaticamente uma DM fechada.
      responses:
        '204':
          description: Usuário desbloqueado
        '400':
          description: user_id inválido ou igual ao usuário autenticado
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /users/settings:
    put:
      tags: [Users]
      summary: Atualiza as configurações do usuário autenticado
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [config]
              properties:
                config:
                  $ref: '#/components/schemas/UserConfig'
      responses:
        '200':
          description: Configurações atualizadas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSettings'
        '400':
          description: Campo ausente ou inválido
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /users/{user_id}:
    put:
      tags: [Users]
      summary: Atualiza nickname, status, description e typing (somente o próprio usuário)
      parameters:
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
      responses:
        '200':
          description: Perfil atualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericResponse'
        '400':
          description: Campo ausente ou inválido
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /users/{user_id}/avatar:
    get:
      tags: [Users]
      summary: Serve avatar público sem credenciais, inclusive em páginas sandbox de plugins
      security: []
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: Bytes do avatar (Content-Type do MIME registrado; Cache-Control public, max-age=3600)
          headers:
            Cross-Origin-Resource-Policy: {schema: {type: string, enum: [cross-origin]}}
            Access-Control-Allow-Origin: {schema: {type: string, enum: ['*']}}
            X-Content-Type-Options: {schema: {type: string, enum: [nosniff]}}
          content:
            image/png:
              schema:
                type: string
                format: binary
            image/jpeg:
              schema:
                type: string
                format: binary
            image/gif:
              schema:
                type: string
                format: binary
            image/webp:
              schema:
                type: string
                format: binary
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Users]
      summary: Atualiza o avatar (base64, GIF/JPEG/JPG/PNG/WEBP, máx. 2MB, 512px)
      parameters:
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAvatarRequest'
      responses:
        '200':
          description: Avatar atualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericResponse'
        '400':
          description: Avatar inválido (base64 de GIF/JPEG/JPG/PNG/WEBP até 2MB)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /users/{user_id}/banner:
    put:
      tags: [Users]
      summary: Atualiza o banner (base64, GIF/JPEG/JPG/PNG/WEBP, máx. 2MB, 512px); corpo vazio remove o banner
      parameters:
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateBannerRequest'
      responses:
        '200':
          description: Banner atualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericResponse'
        '400':
          description: Banner inválido (base64 de GIF/JPEG/JPG/PNG/WEBP até 2MB)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /users/{user_id}/status:
    put:
      tags: [Users]
      summary: Atualiza o status persistido (away/busy; null remove)
      description: >
        O status vale enquanto o usuário estiver online (disponibilizado via
        presence_update/presence_sync); offline, o status persistido vale na
        próxima conexão.
      parameters:
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateStatusRequest'
      responses:
        '200':
          description: Status atualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericResponse'
        '400':
          description: Status inválido (deve ser away, busy ou null)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /users/{user_id}/password:
    put:
      tags: [Users]
      summary: Altera a própria senha e reinicia a flag de reset de senha
      description: Senha precisa ter no mínimo 8 caracteres, 1 letra maíscula + 1 caractere especial
      parameters:
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '200':
          description: Senha atualizada
          content:
            application/json:
              schema:
