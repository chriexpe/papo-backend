    AppCapabilities:
      type: object
      properties:
        send_invites:
          type: boolean
          default: false
        private_storage:
          type: boolean
          default: false
          description: Permite KV persistente privado no namespace da instalação plugin.
        send_messages:
          type: boolean
          default: false
        read_messages:
          type: boolean
          default: false
        post_app_embeds:
          type: boolean
          default: false
    AppInstallation:
      type: object
      description: Identidade do servidor. created_by é histórico e propriedade de armazenamento; perder roles ou ser
        banido não desativa o app. Hash nunca é exposto.
      properties:
        storage_quota:
          $ref: '#/components/schemas/AppStorageQuota'
        storage_quota_overrides:
          $ref: '#/components/schemas/AppStorageQuotaOverride'
        id:
          type: string
          format: uuid
        plugin_digest:
          type: string
          pattern: '^[0-9a-f]{64}$'
        version:
          type: string
        state:
          type: string
          enum: [enabled, disabled, quarantined, removed]
          description: Estado operacional de instalações plugin.
        settings:
          type: object
        approved_origins:
          type: array
          items: {type: string}
        approved_permissions:
          type: array
          items: {type: string}
        explicit_scopes:
          type: array
          items: {type: string, format: uuid}
        max_memory_mb:
          type: integer
          minimum: 1
          maximum: 256
        revision:
          type: integer
          format: int64
        transition_pending:
          type: boolean
          description: Transição incompleta; UI e invocações externas ficam indisponíveis.
        app_key:
          type: string
        kind:
          type: string
          enum:
          - remote
          - plugin
        name:
          type: string
        display_name:
          type: string
        created_by:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
        revoked_at:
          type: string
          format: date-time
        capabilities:
          $ref: '#/components/schemas/AppCapabilities'
    AppToken:
      type: object
      properties:
