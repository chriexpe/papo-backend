        O cliente reduz proporcionalmente à largura da timeline. Em overlay,
        size define somente o card; o popup usa a área do chat, sem esse limite autoral.
      properties:
        width: {type: integer, minimum: 1}
        height: {type: integer, minimum: 1}
    AppSurfaceReference:
      type: object
      additionalProperties: false
      required: [app_installation_id, id]
      properties:
        app_installation_id: {type: string, format: uuid}
        id: {type: string}
    AppFrameEmbed:
      type: object
      additionalProperties: false
      required: [id, source_type, surface, size, load, display]
      description: |
        Um frame por mensagem, declarado pelo plugin proprietário. Sem header de
        provedor: não contém nome, avatar, provider, author ou metadados de card nativo.
        A autoria continua na mensagem, fora do frame. Só há title se enviado pelo app.
        Entry é resolvida contra a superfície declarada e origens aprovadas atuais.
        Disable/remove torna o frame inerte omitindo entry e poster; referência,
        size/load/display persistidos e title permanecem. Um teto reduzido também
        impede lançar frames históricos que agora excedem o máximo.

        load=click (padrão) mostra poster ou card neutro com title até o clique,
        sem botão de play de vídeo. load=visible ativa ao entrar na área visível.
        display=inline (padrão) ativa na mensagem com clipping; sair da tela ou
        trocar de canal destrói a superfície. display=overlay exige load=click:
        abre popup na área do chat, com margens das pills; size só dimensiona o card.
        O cliente desenha a barra com identidade do autor, title opcional e fechar;
        Esc, botão de fechar e gesto de voltar fecham; trocar de canal destrói.
        Em todos os modos uma única superfície vive entre apps e rich-link players;
        a mais recentemente ativada/visível vence e as outras mostram o poster.
        Aplicam-se os requisitos de isolamento e fallback documentados em AppChannel.
      oneOf:
        - properties:
            display: {enum: [inline]}
        - properties:
            display: {enum: [overlay]}
            load: {enum: [click]}
      properties:
        id: {type: string, format: uuid}
        source_type: {type: string, enum: [app]}
        surface: {$ref: '#/components/schemas/AppSurfaceReference'}
        entry:
          type: string
          description: Destino aprovado; ausente quando inerte.
        size: {$ref: '#/components/schemas/AppSurfaceSize'}
        load: {type: string, enum: [click, visible], default: click}
        display: {type: string, enum: [inline, overlay], default: inline}
        poster:
          type: string
          description: URL /apps/<id>/ui/... da imagem declarada; ausente quando não definida ou inerte.
        title: {type: string, maxLength: 256}
    AppEmbedSurfaceDeclaration:
      type: object
      required: [id, kind, source, entry, size]
      description: >
        Metadados fornecidos pela PR 5 a partir de plugin.toml. Poster opcional deve
        ser imagem existente confinada a ui/, sem traversal/symlinks. Formatos
        PNG/JPEG/GIF/WebP/SVG são validados. frame_width/frame_height foram substituídos
        por size. Load padrão click; display padrão inline; overlay+visible é rejeitado.
      oneOf:
        - properties:
            display: {enum: [inline]}
        - required: [display]
          properties:
            display: {enum: [overlay]}
            load: {enum: [click]}
      properties:
        id: {type: string}
        kind: {type: string, enum: [embed]}
        source: {type: string, enum: [bundled, remote]}
        entry: {type: string}
        size: {$ref: '#/components/schemas/AppSurfaceSize'}
        load: {type: string, enum: [click, visible], default: click}
        display: {type: string, enum: [inline, overlay], default: inline}
        poster: {type: string, example: ui/poster.png}
    NativeEmbed:
      type: object
      description: >
        Embed de mensagem. source_type: 'link' (preview automático de link,
        obtido por fetch e reutilizado pelo cache por URL normalizada) ou
        'custom' (embed enviado pela mensagem, dono do próprio registro).
        fetch_method: 'opengraph' (parser OpenGraph), 'oembed' (provedor
        allowlistado), 'gif' (resolvedor tenor/giphy/klipy: título + thumbnail
        GIF animada linkando ao page URL original) ou 'manual' (embed
        customizado).

        A mídia é referenciada internamente: a imagem da thumbnail é servida
        por GET /embeds/{embed_id} (image_data) e o vídeo por
        GET /embeds/{embed_id}/video (relay autenticado com suporte a Range).

        Player: `video` tem duas formas. Vídeo direto (og:video ou embed
        customizado) traz `mime_type` de vídeo e é reproduzido pelo relay. Para
        o provedor de iframe allowlistado (YouTube), `video.url` é a página de
        embed `https://www.youtube.com/embed/<id>` e `mime_type` não vem: o
        cliente renderiza iframe somente quando a URL casa exatamente com esse
        padrão (derivado por padrão hardcoded do backend a partir da URL do
        link, nunca do campo `html` da resposta oEmbed) e não chama o relay.

        Os dois formatos continuam disponíveis a apps sem alteração no formato
        ou comportamento.
      properties:
        id:
          type: string
          format: uuid
        source_type:
          type: string
          enum: [link, custom]
        fetch_method:
          type: string
          enum: [opengraph, oembed, manual, gif]
        provider:
          type: string
          nullable: true
          description: Nome do provedor (oEmbed)
        site_name:
          type: string
          nullable: true
          description: Nome do site (og:site_name)
        url:
          type: string
          format: uri
          nullable: true
          description: >
            URL da página exibida (og:url quando o site declara; caso contrário
            a URL do link). Em embed customizado, a URL informada por quem
            criou o embed.
        title:
          type: string
          nullable: true
          description: Título (máx. 256 caracteres, truncado)
        description:
          type: string
          nullable: true
          description: Descrição (máx. 4192 caracteres, truncada)
        color:
          type: string
          nullable: true
          pattern: '^#[0-9a-fA-F]{6}$'
          description: Cor de destaque do embed customizado (#RRGGBB)
        author:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/EmbedAuthor'
        thumbnail:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/EmbedMedia'
          description: Thumbnail do embed (imagem baixada e re-servida pelo backend)
        image:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/EmbedMedia'
          description: Imagem adicional do embed customizado
        video:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/EmbedMedia'
          description: >
            Vídeo do embed: arquivo direto com mime_type de vídeo (servido pelo
            relay GET /embeds/{embed_id}/video) ou, para o provedor de iframe
            allowlistado (YouTube), a página de embed em `url` sem mime_type
            (renderizada em iframe pelo cliente).
        footer:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/EmbedFooter'
        fields:
          type: array
          items:
            $ref: '#/components/schemas/EmbedField'
          description: Fields do embed, na ordem de exibição (máx. 25)
        embed_url:
          type: string
          format: uri
          nullable: true
          deprecated: true
          description: >
            Não é emitido pelas respostas atuais: o iframe derivado do padrão
            hardcoded do backend chegou a ser modelado aqui e hoje é entregue em
            `video` (url sem mime_type). O padrão continua hardcoded
            (https://www.youtube.com/embed/<id>) e nunca vem de HTML recebido do
            site: o cliente deve renderizar iframe somente se a URL casar
            exatamente com ele (provedor allowlistado).
        created_at:
          type: string
          format: date-time
        fetched_at:
          type: string
          format: date-time
          nullable: true
          description: >
            Última busca do link embed (omitido quando o embed é customizado).

    EmbedAuthor:
      type: object
      description: >
        Autor declarado pelo site (oEmbed) ou pelo embed customizado.
      properties:
        name:
          type: string
          nullable: true
          description: Nome do autor (máx. 256 caracteres)
        url:
          type: string
          format: uri
          nullable: true
        media:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/EmbedMedia'
          description: Avatar/ícone do autor

    EmbedMedia:
      type: object
      description: >
        Mídia do embed (thumbnail, imagem, vídeo, ícone do footer, avatar do
        autor). A referência interna do blob (sha256) não é exposta: a imagem é
        lida por GET /embeds/{embed_id} e o vídeo por
        GET /embeds/{embed_id}/video.
      properties:
        url:
          type: string
          format: uri
          nullable: true
          description: >
            URL HTTPS da mídia de vídeo no backend de origem (o cliente não a
            usa direto: pede o relay GET /embeds/{embed_id}/video) ou, quando
            `video` é o iframe allowlistado do provedor (YouTube), a URL da
            página de embed que o cliente renderiza em iframe. Imagens não
            expõem URL.
        mime_type:
          type: string
          nullable: true
          description: >
            MIME da mídia. Imagem: image/jpeg, image/png, image/webp,
            image/gif. Vídeo: video/mp4, video/webm, video/ogg. Ausente quando
            `video` é a página de iframe allowlistada (não é arquivo de vídeo).
        width:
          type: integer
          nullable: true
        height:
          type: integer
          nullable: true
        size_bytes:
          type: integer
          format: int64
          nullable: true

    EmbedFooter:
      type: object
      description: Rodapé do embed (texto e ícone opcionais).
      properties:
        text:
          type: string
          nullable: true
          description: Texto do rodapé (máx. 2048 caracteres)
        icon:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/EmbedMedia'

    EmbedField:
      type: object
      description: Linha de nome/valor do embed.
      properties:
        position:
          type: integer
          description: Ordem de exibição (0..N)
        name:
          type: string
          description: Nome da field (máx. 256 caracteres)
        value:
          type: string
          description: Valor da field (máx. 1024 caracteres)
        inline:
          type: boolean
          description: true quando a field pode ser renderizada lado a lado

    EmbedWithImage:
      description: >
        Embed + imagem da thumbnail embutida em base64 (image_data) e ícone do
        autor em base64 (author_image_data) — resposta de GET /embeds/{embed_id}.
      allOf:
        - $ref: '#/components/schemas/Embed'
        - type: object
          properties:
            image_data:
              type: string
              format: byte
              nullable: true
              description: Imagem do embed em base64 (null quando não há imagem)
            author_image_data:
              type: string
              format: byte
              nullable: true
              description: >
                Ícone do autor em base64 (null quando o embed não tem author_media)

    EmbedInput:
      type: object
      description: >
        Cards customizados mantêm o formato e comportamento existentes, inclusive
        para apps. Para source_type=app, somente app_surface_id e title opcional
        (máximo 256 caracteres Unicode) são aceitos além do discriminador.
        É obrigatório send_messages + post_app_embeds, com um frame por mensagem
        em canal text/voice escopado. Size/load/display/poster vêm da superfície
        declarada, nunca de overrides na mensagem. Campos de card nativo como
        imagem, thumbnail, descrição, author, fields, footer e cor são recusados
        no frame; use source_type=custom para esses cards. Envio interno pela PR 5
        usa CreatePluginMessage, sem token de plugin. Humanos/webhooks não podem
        postar frames. Os limites existentes de texto e número de embeds continuam.
      properties:
        source_type: {type: string, enum: [custom, app], default: custom}
        app_surface_id:
          type: string
          description: Obrigatório somente para app; ID da superfície embed do próprio plugin.
        title:
          type: string
          maxLength: 256
        description:
          type: string
        url:
          type: string
          format: uri
          description: URL da página relacionada (http ou https)
        color:
          type: string
          pattern: '^#[0-9a-fA-F]{6}$'
        site_name:
          type: string
        author:
          type: object
          properties:
            name:
              type: string
            url:
              type: string
              format: uri
            icon_url:
              type: string
              format: uri
              description: >
                URL HTTPS da imagem do autor (avatar). O backend baixa com o
                client SSRF-safe e re-serva na tabela media (author_media); a URL
                original nunca é exposta na resposta. Falha de download grava o
                embed sem o ícone.
        footer:
          type: object
          properties:
            text:
              type: string
        thumbnail:
          $ref: '#/components/schemas/EmbedMediaInput'
        image:
          $ref: '#/components/schemas/EmbedMediaInput'
        video:
          $ref: '#/components/schemas/EmbedMediaInput'
        fields:
          type: array
          items:
            type: object
            required: [name, value]
            properties:
              name:
                type: string
              value:
                type: string
              inline:
                type: boolean

    EmbedMediaInput:
      type: object
      description: >
        Mídia de um embed customizado informada por URL: o backend baixa e
        re-serve (client SSRF-safe, robots.txt, teto de tamanho e magic bytes
        verificados). Thumbnail/image: exige HTTPS e MIME de imagem suportado
        (image/jpeg, image/png, image/webp, image/gif). Video: exige HTTPS e
        mime_type obrigatório dentro do allowlist (video/mp4, video/webm,
        video/ogg); é servido pelo relay GET /embeds/{embed_id}/video.
      required: [url]
      properties:
        url:
          type: string
          format: uri
        mime_type:
          type: string
          description: MIME declarado; rejeitado quando não suportado

    Role:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        color:
          type: string
          nullable: true
          example: '#FF0000'
        permissions:
          $ref: '#/components/schemas/RolePermissions'
        created_at:
          type: string
          format: date-time

    RoleSummary:
