  /app/gateway:
    get:
      tags: [Apps]
      summary: Gateway WSS de eventos duráveis por instalação
      security:
        - appBearer: []
      description: |
        Upgrade WebSocket com `Authorization: Bearer <token>` remoto ativo.
        Cookies, parâmetros de URL e subprotocolos não substituem Bearer. Usar
        WSS em produção, normalmente via proxy TLS; WS é permitido no servidor
        HTTP local para desenvolvimento. Este gateway não usa o hub humano /ws.

        1. Servidor envia `{"op":"hello","version":1,"heartbeat_interval_ms":30000}`.
        2. Cliente responde em até 10 s com `{"op":"hello"}` ou
           `{"op":"hello","resume_after":42}`. O padrão é o último ack durável.
           resume_after é um checkpoint declarado pelo cliente, entre 0 e last_seq;
           ele não confirma entregas por si só. Instalações novas começam no presente.
        3. Servidor incrementa uma época durável, substitui a conexão anterior e
           envia `{"op":"ready","epoch":2,"cursor":42,"replay_floor":0,"last_seq":45}`.
           A ativação ocorre no hello válido, e não apenas no upgrade HTTP.
        4. Cada `dispatch` contém op, epoch e os campos de AppEventDelivery.
           A ordem é a atribuição por instalação. Há lacunas quando a autorização
           descarta fatos; elas não indicam perda de um fato autorizado.
        5. Cliente persiste seus efeitos/checkpoint antes de enviar
           `{"op":"ack","epoch":2,"delivery_seq":45}`. A confirmação é cumulativa:
           todos os dispatches recebidos até essa sequência devem ter sido
           processados. Não pode superar o maior checkpoint declarado/enviado na
           conexão. Acks antigos/repetidos são idempotentes; época obsoleta é recusada.
        6. Cliente envia `{"op":"heartbeat","epoch":2}` a cada 30 s; servidor
           responde `{"op":"heartbeat_ack","epoch":2}`. Sem frames por 90 s,
           a conexão termina. Frames de entrada têm limite de 4 KiB e 100/s
           (burst 200). Frames malformados ou controles inválidos encerram o socket.

        Uma nova conexão cerca os acks da antiga no PostgreSQL, inclusive entre
        processos. Frames já em trânsito podem pertencer à época anterior; o
        consumidor deve ignorá-los após substituição. Em crash após envio e antes
        de ack, o mesmo event_id e delivery_seq são reenviados: deduplicar por
        event_id. Um novo processo/reconexão não depende da memória do registry.

        O buffer é limitado a 32 controles/sequências; não guarda snapshots.
        O payload é relido e a credencial, a época, as capacidades e o escopo são
        revalidados antes de enviar. Um consumidor lento é desconectado; seu
        backlog não confirmado permanece durável até os limites de retenção.
        Rotação e revogação encerram conexões autenticadas pelo token antigo.

        Tombstones e remoção de conteúdo seguem AppEventTombstone. Exclusão de
        mensagem substitui created/updated ainda sem ack por IDs e redacted:true.
        Embeds/previews são obtidos por REST, fora do snapshot.

        Retenção é limitada por idade (padrão 7 dias) e 10000 linhas por instalação,
        configuráveis no servidor. Snapshots confirmados por todos os destinatários
        são liberados para poda. Replay abaixo do piso, no hello ou durante o
        consumo, recebe `{"op":"resync_required","epoch":3,"cursor":0,
        "replay_floor":40,"last_seq":45}` e a conexão termina. Reconciliar via
        GET /app/channels/:id/messages; depois reconectar usando o last_seq recebido
        como checkpoint. Fatos atribuídos depois dele continuam disponíveis para replay.
      responses:
        '101':
          description: |
            Upgrade concluído. Frames JSON seguem AppGatewayServerFrame e
            AppGatewayClientFrame; OpenAPI não representa o fluxo WSS como body HTTP.
        '400':
          description: Requisição não é um upgrade WebSocket válido.
        '401':
          description: Mesmo erro para Bearer ausente, errado, revogado ou rotacionado.
        '429':
          description: Limite de upgrades da instalação excedido.

  /app/channels/{channel_id}/messages:
    parameters:
    - name: channel_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    post:
      tags:
      - Apps
      summary: Envia mensagem como app
      description: 'Bearer remoto, send_messages e canal text/voice explicitamente autorizado. Cookie/JWT não autenticam.
        Token ausente, errado, rotacionado ou revogado retorna o mesmo 401. Snapshot external_author sempre contém
        source=app, id, name e avatar_url=/apps/<id>/avatar; não aceita override. Attachments e embeds pertencem ao
        created_by para armazenamento, nunca autoria. Não dispara @everyone. Retry com a mesma external_message_id
        retorna 200 com mensagem completa, payload ignorado e sem repetir efeitos. A chave é por instalação, não por
        canal; uma chave de outro canal retorna 403. Limitação: a deduplicação dura somente enquanto a mensagem existir;
        após exclusão, um retry cria outra mensagem. Chaves retidas estão fora do escopo. multipart/form-data, até
        110MB de corpo; até 10 arquivos de 100MB, content até 8192 caracteres e até 10 embeds.'
      responses:
        '201':
          description: Operação concluída
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '400':
          description: Parâmetro inválido (invalid-param)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '429':
          description: 'Token bucket por instalação: 10 requisições/s, burst 20. Retry-After: 1. Além do limite global
            por IP.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
        '200':
          description: Retry idempotente; attachments, embeds e reações atuais
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
      security:
      - appBearer: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                content:
                  type: string
                external_message_id:
                  type: string
                  maxLength: 200
                reply_to:
                  type: string
                  format: uuid
                embeds:
                  type: string
                  description: JSON array de embeds customizados
                attachments:
                  type: array
                  items:
                    type: string
                    format: binary
    get:
