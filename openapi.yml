              type: object
              description: Entrada JSON do plugin, até 64 KiB.
      description: Até um inline embed por message.send, apenas superfície embed própria. Três falhas consecutivas
        colocam em quarentena persistente. Digest novo exige reaprovação; com hot reload sem expansão de permissões/origens/escopos,
        aplica na fronteira de invocação. Host responses podem retornar HTTP 200 com ok=false.

  /interactions:
    post:
      tags:
      - Apps
      summary: Executar botão ou ação de usuário
      description: Valida leitura, plugin habilitado e seletor existente. on_interaction
        recebe identidades verificadas. Botões com opens não usam esta rota. Prazo padrão
        de 3 s, com limites por usuário e instalação. A resposta é síncrona e leva o
        result devolvido pelo on_interaction, visível somente a quem clicou.
      security:
      - cookieAuth: []
      responses:
        '200':
          description: on_interaction concluído
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppInteractionResult'
        '400':
          description: Parâmetros inválidos
        '401':
          description: Autenticação ou sessão inválida
        '403':
          description: Acesso negado
        '404':
          description: Recurso não encontrado
        '429':
          description: 'Limite excedido; Retry-After: 60'
        '504':
          description: O app não respondeu a tempo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AppInteraction'
  /apps/{installation_id}/launch:
    post:
      tags:
      - Apps
      summary: Emitir ticket de lançamento
      description: 'Ticket opaco de uso único, válido por 60 s. Vinculado a usuário,
        instalação, superfície, canal e mensagem/convite opcionais. Cliente entrega
        somente no fragmento #papo_ticket, nunca query ou sessão Papo.'
      security:
      - cookieAuth: []
      responses:
        '200':
          description: Operação concluída
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppLaunchResult'
        '400':
          description: Parâmetros inválidos
        '401':
          description: Autenticação ou sessão inválida
        '403':
          description: Acesso negado
        '404':
          description: Recurso não encontrado
        '429':
          description: 'Limite excedido; Retry-After: 60'
        '504':
          description: O app não respondeu a tempo
      parameters:
      - name: installation_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AppLaunch'
  /apps/{installation_id}/session:
    post:
      tags:
      - Apps
      summary: Trocar ticket por sessão UI
      description: CORS *, sem credenciais; ignora cookies. Consumo atômico do ticket.
        Token opaco, armazenado como SHA-256. Inatividade de 30 min e máximo absoluto
        de 8 h; somente RPC válido estende a inatividade.
      security: []
      responses:
        '200':
          description: Operação concluída
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppUISession'
        '400':
          description: Parâmetros inválidos
        '401':
          description: Autenticação ou sessão inválida
        '403':
          description: Acesso negado
        '404':
          description: Recurso não encontrado
        '429':
          description: 'Limite excedido; Retry-After: 60'
        '504':
          description: O app não respondeu a tempo
      parameters:
      - name: installation_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AppTicket'
    options:
      summary: Preflight da ponte confinada
      security: []
      parameters:
      - name: installation_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '204':
          description: CORS *, métodos POST/OPTIONS e headers Content-Type/Authorization;
            sem credenciais.
  /apps/{installation_id}/rpc:
    post:
      tags:
      - Apps
      summary: Chamar somente o plugin da sessão
      description: 'CORS *, sem credenciais. Bearer UI com vínculo restrito. Revalida
        ACL, estado, digest e geração em cada chamada. on_ui_call recebe user_id verificado,
        channel_id, session_id, method, params e convite aceito opcional. Disable/app_invalidate
        revogam tokens e a perda de leitura do canal os invalida; inválidos retornam 401. Polling padrão do
        SDK: 1500 ms, configurável.'
      security:
      - appUIBearer: []
      responses:
        '200':
          description: Operação concluída
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PluginResult'
        '400':
          description: Parâmetros inválidos
        '401':
          description: Autenticação ou sessão inválida
        '403':
          description: Acesso negado
        '404':
          description: Recurso não encontrado
        '429':
          description: 'Limite excedido; Retry-After: 60'
        '504':
          description: O app não respondeu a tempo
      parameters:
      - name: installation_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AppRPC'
    options:
      summary: Preflight da ponte confinada
      security: []
      parameters:
      - name: installation_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '204':
          description: CORS *, métodos POST/OPTIONS e headers Content-Type/Authorization;
            sem credenciais.
  /notifications/{id}/accept:
    post:
      tags:
      - Apps
      summary: Aceitar convite do app
      description: Somente destinatário. Decisão atômica e idempotente; convite expirado
        não pode ser aceito. Aceitação retorna contexto para abrir o canal e pedir launch,
        sem emitir token automaticamente.
      security:
      - cookieAuth: []
      responses:
        '200':
          description: Operação concluída
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppInvite'
        '400':
          description: Parâmetros inválidos
        '401':
          description: Autenticação ou sessão inválida
        '403':
          description: Acesso negado
        '404':
          description: Recurso não encontrado
        '429':
          description: 'Limite excedido; Retry-After: 60'
        '504':
          description: O app não respondeu a tempo
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
  /notifications/{id}/decline:
    post:
      tags:
      - Apps
      summary: Recusar convite do app
      description: Somente destinatário. Decisão atômica e idempotente; convite expirado
        não pode ser aceito. Aceitação retorna contexto para abrir o canal e pedir launch,
        sem emitir token automaticamente.
      security:
      - cookieAuth: []
      responses:
        '200':
          description: Operação concluída
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppInvite'
        '400':
          description: Parâmetros inválidos
        '401':
          description: Autenticação ou sessão inválida
        '403':
          description: Acesso negado
        '404':
          description: Recurso não encontrado
        '429':
          description: 'Limite excedido; Retry-After: 60'
        '504':
          description: O app não respondeu a tempo
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
  /apps/{installation_id}/user-settings:
    patch:
      tags:
      - Apps
      summary: Silenciar convites de um plugin
      description: ''
      security:
      - cookieAuth: []
      responses:
        '204':
          description: Preferência salva
        '400':
          description: Parâmetros inválidos
        '401':
          description: Autenticação ou sessão inválida
        '403':
          description: Acesso negado
        '404':
          description: Recurso não encontrado
        '429':
          description: 'Limite excedido; Retry-After: 60'
        '504':
          description: O app não respondeu a tempo
      parameters:
      - name: installation_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AppUserSettings'

components:
  securitySchemes:
    appUIBearer:
      type: http
      scheme: bearer
      description: Token opaco confinado de sessão UI; nunca JWT ou segredo remoto.
    appBearer:
      type: http
      scheme: bearer
      description: Token remoto de app; cookies e JWT de usuários não são aceitos. Tokens UI usam outro esquema confinado.
    cookieAuth:
      type: apiKey
      in: cookie
      name: Auth
      description: JWT em cookie HttpOnly (Path=/, Secure, SameSite=Strict)

  parameters:
    PluginId:
      name: id
      in: path
      required: true
      schema:
        type: string
        pattern: '^[a-z0-9][a-z0-9._-]{0,99}$'
    AppId:
      name: app_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    UserId:
      name: user_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ChannelId:
      name: channel_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RoleId:
      name: role_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    MessageId:
      name: message_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    WebhookId:
      name: webhook_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    EmojiId:
      name: emoji_id
      in: path
      required: true
      schema:
        type: string
        format: uuid

  responses:
    Unauthorized:
      description: Token ausente, inválido ou expirado
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Autenticado, mas sem permissão
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Recurso não encontrado
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Error'
    Banned:
      description: IP/usuário banido
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Error'
    InternalError:
      description: Erro interno do servidor
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Error'
    NoContent:
      description: Sucesso sem corpo (204 No Content)

  schemas:
    Error:
      type: object
      description: Erro RFC 7807 (application/problem+json)
      required: [type, title, status]
      properties:
        type:
          type: string
          example: https://papo.com/errors/invalid-param
        title:
          type: string
          example: Parâmetro inválido
        status:
          type: integer
          example: 400
        detail:
          type: string
          example: Campo 'username' é obrigatório
        instance:
          type: string
          example: /auth/login

    GenericResponse:
      type: object
      properties:
        response:
          type: string
          example: User status updated successfully

    RegisterRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string
          description: Precisa ter no mínimo 8 caracteres, 1 letra maíscula + 1 caractere especial

    RegisterResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        created_at:
          type: string
          format: date-time

    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string

    LoginResponse:
      type: object
      description: O JWT não é retornado no corpo; a sessão é entregue exclusivamente pelo cookie Auth (HttpOnly)
      properties:
        user:
          type: object
          properties:
            id:
              type: string
              format: uuid
            username:
              type: string
        connection_violation:
          type: boolean
          description: Verdadeiro se houve detecção de reuso de token de sessão (todas as conexões foram revogadas)

    LoginServerRequest:
      type: object
      required: [server_password]
      properties:
        server_password:
          type: string

    PushDeviceRequest:
      type: object
      description: Dispositivo de push do usuário autenticado (PUT/DELETE /users/me/push-device)
      required: [token]
      properties:
        token:
          type: string
          description: Token de registro do FCM (registro atualizado/upsert)
        platform:
          type: string
          enum: [android, ios]
        device_name:
          type: string
          maxLength: 32
        provider:
          type: string
          default: fcm

    OpenDirectMessageRequest:
      type: object
      required: [user_id]
      properties:
        user_id:
          type: string
          format: uuid

    DirectConversation:
      type: object
      required: [id, user, created_at, unread_count]
      properties:
        id:
          type: string
          format: uuid
          description: ID da conversa; também é o channel_id usado pelos endpoints de mensagens.
        user:
          $ref: '#/components/schemas/UserSummary'
        created_at:
          type: string
          format: date-time
        last_message:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/ChannelLastMessage'
        last_read_message:
          type: string
          format: uuid
          nullable: true
        last_read_at:
          type: string
          format: date-time
          nullable: true
        unread_count:
          type: integer
          minimum: 0

    DirectConversationList:
      type: object
      required: [dms]
      properties:
        dms:
          type: array
          items:
            $ref: '#/components/schemas/DirectConversation'

    UserSummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        nickname:
          type: string
          nullable: true
        banned:
          type: boolean
          description: Indica se o usuário está banido
        status:
          type: string
          nullable: true
          enum: [away, busy]
          description: Status persistido do usuário (vale enquanto online)
        status_message:
          type: string
          nullable: true
        typing:
          type: string
          nullable: true
          maxLength: 64
          description: Frase de digitação personalizada (exibida no cliente quando o usuário está digitando)
        status_updated_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
        roles:
          type: array
          description: Roles atribuídas ao usuário
          items:
            $ref: '#/components/schemas/RoleSummary'

    UserProfile:
      type: object
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        nickname:
          type: string
          nullable: true
        avatar_blob:
          type: string
          format: byte
          description: Avatar em base64
        avatar_format:
          type: string
          example: PNG
        banner_media:
          type: string
          nullable: true
          description: Referência (sha256) do banner na mídia content-addressable; o arquivo é baixado via GET /media/{sha_hash}
        description:
          type: string
          nullable: true
          maxLength: 512
        status:
          type: string
          nullable: true
          enum: [away, busy]
          description: Status persistido do usuário (vale enquanto online)
        status_message:
          type: string
          nullable: true
        typing:
          type: string
          nullable: true
          maxLength: 64
          description: Frase de digitação personalizada (exibida no cliente quando o usuário está digitando)
        status_updated_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
        roles:
          type: array
          description: Roles atribuídas ao usuário
          items:
            $ref: '#/components/schemas/RoleSummary'

    UserSummaryBatchRequest:
      type: object
      required: [ids]
      properties:
        ids:
          type: array
          minItems: 1
          maxItems: 1000
          items:
            type: string
            format: uuid

    ProfileBatchRequest:
      type: object
      required: [ids]
      properties:
        ids:
          type: array
          minItems: 1
          maxItems: 50
          items:
            type: string
            format: uuid

    WhoamiResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        nickname:
          type: string
          nullable: true
        avatar_blob:
          type: string
          format: byte
          description: Avatar em base64
        avatar_format:
          type: string
          example: PNG
        status:
          type: string
          nullable: true
          enum: [away, busy]
          description: Status persistido do usuário (vale enquanto online)
        status_message:
          type: string
          nullable: true
        typing:
          type: string
          nullable: true
          maxLength: 64
          description: Frase de digitação personalizada (exibida no cliente quando o usuário está digitando)
        status_updated_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
        roles:
          type: array
          description: Roles atribuídas ao usuário
          items:
            $ref: '#/components/schemas/RoleSummary'
        settings:
          type: object
          properties:
            version:
              type: integer
            config:
              $ref: '#/components/schemas/UserConfig'
        connection_violation:
          type: boolean
          description: Verdadeiro se houve detecção de reuso de token de sessão (todas as conexões foram revogadas)

    Connection:
      type: object
      properties:
        id:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
          description: Expiração do JWT desta conexão (token_issued_at + 24h)

    RefreshResponse:
      type: object
      description: O novo JWT não é retornado no corpo; é entregue exclusivamente pelo cookie Auth (HttpOnly)
      properties:
        connection:
          $ref: '#/components/schemas/Connection'

    ConnectedDevicesResponse:
      type: object
      properties:
        connections:
          type: array
          items:
            $ref: '#/components/schemas/Connection'

    DropConnectionRequest:
      type: object
      required: [connection_id]
      properties:
        connection_id:
          type: string
          description: UUID da conexão a revogar, ou "ALL" para revogar todas

    DropConnectionResponse:
      type: object
      properties:
        dropped:
          type: integer
          description: Número de conexões revogadas

    UserSettings:
      type: object
      properties:
        user_id:
          type: string
          format: uuid
        version:
          type: integer
        config:
          $ref: '#/components/schemas/UserConfig'
        updated_at:
          type: string
          format: date-time

    UserConfig:
      type: object
      properties:
        theme:
          type: string
          enum: [dark, light, system]
          default: system
        notifications:
          $ref: '#/components/schemas/Notifications'
        display:
          $ref: '#/components/schemas/Display'

    Notifications:
      type: object
      properties:
        enabled:
          type: boolean
          default: true
        messagePreview:
          type: boolean
          default: true
        sound:
          type: boolean
          default: true
        mentions:
          type: boolean
          default: true

    Display:
      type: object
      properties:
        fontSize:
          type: string
          enum: [small, medium, huge]
          default: medium
        messageDensity:
          type: string
          enum: [compact, normal, comfortable]
          default: normal
        showTimestamps:
          type: boolean
          default: true
        showAvatars:
          type: boolean
          default: true

    UpdateUserRequest:
      type: object
      required: [nickname, status, description]
      properties:
        nickname:
          type: string
          maxLength: 32
        status:
          type: string
          maxLength: 64
        description:
          type: string
          maxLength: 512
        typing:
          type: string
          nullable: true
          maxLength: 64
          description: Frase de digitação personalizada; ausente (null) não altera o valor atual

    UpdateAvatarRequest:
      type: object
      required: [avatar, avatar_format]
      properties:
        avatar:
          type: string
          description: Base64 de GIF, JPEG/JPG, PNG ou WEBP (máx. 2MB, 512px)
        avatar_format:
          type: string
          enum: [GIF, JPEG, JPG, PNG, WEBP]

    UpdateBannerRequest:
      type: object
      required: [banner, banner_format]
      properties:
        banner:
          type: string
          description: Base64 de GIF, JPEG/JPG, PNG ou WEBP (máx. 2MB, 2048px); vazio remove o banner
        banner_format:
          type: string
          enum: [GIF, JPEG, JPG, PNG, WEBP]
          description: Vazio remove o banner

    UpdateStatusRequest:
      type: object
      properties:
        status:
          type: string
          nullable: true
          enum: [away, busy]
          description: Status persistido (away/busy); null remove o status

    PasswordResetConsumeRequest:
      type: object
      required: [token, password]
      properties:
        token:
          type: string
          description: Token presente no link /passwordchange/{token}
        password:
          type: string
          description: Nova senha; mesma política do cadastro

    PasswordResetLinkResponse:
      type: object
      required: [reset_url, expires_at]
      properties:
        reset_url:
          type: string
          format: uri
          example: https://papo.cyberasilo.online/passwordchange/abc123
        expires_at:
          type: string
          format: date-time

    ChangePasswordRequest:
      type: object
      required: [password]
      properties:
        password:
          type: string
          description: Nova senha do usuário, precisa ter no mínimo 8 caracteres, 1 letra maíscula + 1 caractere especial

    BanUserRequest:
      type: object
      required: [ban_state]
      properties:
        user_id:
          type: string
          format: uuid
          description: ID do usuário (o id da URL é o autoritativo)
        ban_state:
          type: boolean
          description: true para banir, false para desbanir

    ReplaceServerRequest:
      type: object
      required: [name, icon_blob, icon_format, password, public]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 32
        icon_blob:
          type: string
          format: byte
          description: Ícone em base64; string vazia remove o ícone
        icon_format:
          type: string
          enum: ['', GIF, JPEG, JPG, PNG, WEBP]
          description: Formato do ícone; use string vazia quando icon_blob estiver vazio
        password:
          type: string
          description: Campo obrigatório; para servidor público pode ser vazio, para privado deve respeitar a política de senha
        public:
          type: boolean

    PatchServerRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 32
          description: Ausente mantém o nome atual
        icon_blob:
          type: string
          format: byte
          description: Ausente mantém o ícone atual; vazio remove o ícone
        icon_format:
          type: string
          enum: ['', GIF, JPEG, JPG, PNG, WEBP]
          description: Obrigatório quando icon_blob contém uma nova imagem; pode ser omitido ou vazio quando icon_blob remove o ícone
        password:
          type: string
          description: Ausente mantém a senha atual de um servidor já privado; obrigatório ao tornar um servidor público em privado
        public:
          type: boolean
          description: Ausente mantém a visibilidade atual
    CreateServerRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
        icon_blob:
          type: string
